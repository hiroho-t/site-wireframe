<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   04 NEWS / 左にラベル＋英字大見出し＋ピルボタン、右に一覧3件
   実測（1440基準）英字見出し 62px ／ 一覧1行 58px・上下1px罫線
   行内：日付14px（left)・タイトル15px・右端に丸ドット
   ============================================================ */
.nw4 { background: var(--c-white); }
.nw4__side { position: absolute; left: var(--wf-pad); top: 298px; width: 380px; }
.nw4__lab { font-size: 15px; font-weight: 500; color: var(--c-sub); }
.nw4__ttl { margin-top: 18px; font-size: 62px; font-weight: 400; line-height: 1; letter-spacing: .04em; color: var(--c-mute); }
.nw4__btn { margin-top: 42px; width: 190px; height: 50px; font-size: 14px; font-weight: 700; gap: 12px; }
.nw4__btn i { font-size: 7px; }

.nw4__list { position: absolute; left: 500px; top: 324px; width: 868px; border-top: 1px solid var(--c-line); }
.nw4__list li {
  height: 58px; display: flex; align-items: center; gap: 34px;
  border-bottom: 1px solid var(--c-line); font-size: 15px;
}
.nw4__list .dt { font-size: 14px; color: var(--c-mute); }
.nw4__list .dot { margin-left: auto; font-size: 8px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf nw4">
    <div class="nw4__side">
      <p class="nw4__lab">ダミーのラベル</p>
      <h2 class="nw4__ttl en">DUMMY</h2>
      <div class="nw4__btn btn-black en">VIEW MORE <i class="fa-solid fa-circle"></i></div>
    </div>
    <ul class="nw4__list">
      <li><span class="dt en">2026.08.03</span><span>【ダミー】ダミーテキストのお知らせ</span><i class="dot fa-solid fa-circle"></i></li>
      <li><span class="dt en">2026.06.09</span><span>【ダミーテキスト】ダミーテキストのお知らせ</span><i class="dot fa-solid fa-circle"></i></li>
      <li><span class="dt en">2026.06.01</span><span>【ダミー】ダミーテキストのお知らせ</span><i class="dot fa-solid fa-circle"></i></li>
    </ul>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
