<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news-010</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   10 NEWS / 左に英字100pxの見出し＋View all、右に日付＋見出しの一覧3件
   URLからDOM実測（1440幅・元セクション高623を800の中央に配置）
   英字 100px/100 lh100 ／ 和文 18px/300 ／ 行ピッチ127
   日付 15px/300 ／ 見出し 16px/600 lh25.6（幅481）
   ============================================================ */
.nw10 { background: var(--c-white); }
.nw10__head { position: absolute; left: 135px; top: 194px; }
.nw10__en { font-size: 100px; font-weight: 100; line-height: 100px; letter-spacing: .01em; }
.nw10__jp { margin-top: 20px; font-size: 18px; font-weight: 300; line-height: 18px; }
.nw10__all { position: absolute; left: 135px; top: 431px; display: flex; align-items: center; gap: 18px; font-size: 15px; }
.nw10__all .cir {
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--c-sub);
}

.nw10__list { position: absolute; left: 629px; top: 212px; width: 676px; }
.nw10__list li { display: flex; gap: 120px; height: 127px; align-items: flex-start; border-bottom: 1px solid var(--c-line); padding-top: 26px; }
.nw10__list .dt { font-size: 15px; font-weight: 300; line-height: 24px; color: var(--c-mute); flex-shrink: 0; }
.nw10__list h3 { width: 481px; font-size: 16px; font-weight: 600; line-height: 25.6px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf nw10">
    <div class="nw10__head">
      <p class="nw10__en en">Dummy</p>
      <p class="nw10__jp">ダミー項目</p>
    </div>
    <p class="nw10__all"><span class="en">View all</span><span class="cir"><i class="fa-solid fa-arrow-right"></i></span></p>

    <ul class="nw10__list">
      <li><span class="dt en">2026.07.14</span><h3>ダミーテキストのお知らせ</h3></li>
      <li><span class="dt en">2025.11.28</span><h3>ダミーテキストダミーテキストのお知らせ</h3></li>
      <li><span class="dt en">2025.10.28</span><h3>ダミーテキストダミーテキスト終了のお知らせ</h3></li>
    </ul>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
