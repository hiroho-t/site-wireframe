<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news-007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   07 NEWS / 左に英字大見出し、右に「すべて見る」。下に1行122pxの一覧3件
   URLからDOM実測（1440幅）英字 64px/500 ／ 和文 20px/500
   行内：日付16px/400 ＋ 角丸タグ14px ＋ タイトル18px/400 lh31.5、右端に丸矢印40px
   ============================================================ */
.nw7 { background: var(--c-white); }
.nw7__head { position: absolute; left: 200px; top: 95px; width: 1040px; display: flex; align-items: flex-start; }
.nw7__en { font-size: 64px; font-weight: 500; line-height: 64px; letter-spacing: .01em; }
.nw7__lab { margin-top: 14px; font-size: 20px; font-weight: 500; line-height: 35px; }
.nw7__all { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 16px; font-weight: 700; }

.nw7__list { position: absolute; left: 208px; top: 362px; width: 1024px; }
.nw7__list li { display: flex; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--c-line); }
.nw7__list .bd { flex: 1; }
.nw7__list .hd { display: flex; align-items: center; gap: 16px; }
.nw7__list .dt { font-size: 16px; line-height: 24px; color: var(--c-sub); }
.nw7__list .tg { font-size: 14px; line-height: 24.5px; color: var(--c-mute); }
.nw7__list h4 { margin-top: 12px; font-size: 18px; line-height: 31.5px; }
.nw7__list .cir {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid var(--c-line); display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--c-sub);
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf nw7">
    <div class="nw7__head">
      <div>
        <p class="nw7__en en">Dummy</p>
        <p class="nw7__lab">ダミー項目</p>
      </div>
      <p class="nw7__all">すべてのダミー項目 <i class="fa-solid fa-arrow-right"></i></p>
    </div>

    <ul class="nw7__list">
      <li>
        <div class="bd"><div class="hd"><span class="dt en">2026.04.06</span></div>
          <h4>ダミーテキスト公開｜20XX年度 ダミーテキストダミーテキスト</h4></div>
        <span class="cir"><i class="fa-solid fa-arrow-right"></i></span>
      </li>
      <li>
        <div class="bd"><div class="hd"><span class="dt en">2026.02.06</span></div>
          <h4>ダミーテキスト公開｜「ダミーテキストダミーテキスト」を開催</h4></div>
        <span class="cir"><i class="fa-solid fa-arrow-right"></i></span>
      </li>
      <li>
        <div class="bd"><div class="hd"><span class="dt en">2025.11.18</span><span class="tg">ダミー</span><span class="tg">ダミー項目</span><span class="tg">ダミー項目名</span></div>
          <h4>「ダミーテキストとダミーテキストの集いダミー」をダミーします</h4></div>
        <span class="cir"><i class="fa-solid fa-arrow-right"></i></span>
      </li>
    </ul>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
