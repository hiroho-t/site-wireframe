<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news-013</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   13 NEWS / 和文42pxの見出し。日付を「日.月／年」の縦2段で見せる一覧
   参考サイトのHTMLをDOM実測（1440幅）
   見出し 42px/700 ／ 小見出し 25px/700 ／ 日付 19px/600＋13px/400 ／ タイトル 17px/700
   行ピッチ 96・下罫線
   ============================================================ */
.news013 { background: var(--c-white); }
.news013__ttl { position: absolute; left: var(--wf-pad); top: 123px; font-size: 42px; font-weight: 700; line-height: 44px; }
.news013__sub { position: absolute; left: var(--wf-pad); top: 205px; font-size: 25px; font-weight: 700; line-height: 50px; }

.news013__list { position: absolute; left: var(--wf-pad); top: 291px; width: var(--wf-content); border-top: 1px solid var(--c-line); }
.news013__list li { display: flex; align-items: center; height: 96px; border-bottom: 1px solid var(--c-line); }
.news013__list .dt { width: 90px; flex-shrink: 0; }
.news013__list .dt b { display: block; font-size: 19px; font-weight: 600; line-height: 19px; }
.news013__list .dt span { display: block; margin-top: 8px; font-size: 13px; line-height: 13px; color: var(--c-mute); }
.news013__list h3 { font-size: 17px; font-weight: 700; line-height: 1.5; }
.news013__list .ar { margin-left: auto; font-size: 14px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf news013">
    <h2 class="news013__ttl">ダミー項目</h2>
    <p class="news013__sub">ダミーテキストに関するお知らせ</p>

    <ul class="news013__list">
      <li><span class="dt"><b class="en">8.5</b><span class="en">2026</span></span>
        <h3>【ダミーテキスト】ダミーテキスト「ダミーテキスト」のご案内</h3>
        <i class="ar fa-solid fa-arrow-right"></i></li>
      <li><span class="dt"><b class="en">7.28</b><span class="en">2026</span></span>
        <h3>ダミーテキストダミーテキストのお知らせ</h3>
        <i class="ar fa-solid fa-arrow-right"></i></li>
      <li><span class="dt"><b class="en">7.16</b><span class="en">2026</span></span>
        <h3>ダミーテキストダミーテキストダミーテキストについて</h3>
        <i class="ar fa-solid fa-arrow-right"></i></li>
      <li><span class="dt"><b class="en">6.30</b><span class="en">2026</span></span>
        <h3>ダミーテキストのご案内</h3>
        <i class="ar fa-solid fa-arrow-right"></i></li>
    </ul>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
