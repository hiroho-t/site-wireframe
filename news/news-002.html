<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news-002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 NEWS / 左に主記事（サムネ＋日付＋大見出し）、右に一覧5件
   見出し 英字48px/700 ＋ 和文14px/700
   主記事 サムネ比率515:252 ／ 日付12px ／ 見出し32px/900 lh1.3
   一覧   日付12px＋角タグ10px、見出し15px/600、下罫線＋padding-bottom18
   ============================================================ */
.nw2 { background: var(--c-white); }
.nw2__wrap { top: 100px; }
.nw2__sh { display: flex; align-items: baseline; gap: 24px; }
.nw2__sh .e { font-size: 48px; font-weight: 700; line-height: 1.2; }
.nw2__sh .j { font-size: 14px; font-weight: 700; line-height: 1.5; letter-spacing: .03em; color: var(--c-mute); }

.nw2__cols { display: flex; justify-content: space-between; gap: 72px; margin-top: 50px; }
.nw2__main { width: 600px; flex-shrink: 0; }
.nw2__main .ph { width: 100%; aspect-ratio: 515/252; border-radius: 10px; }
.nw2__main .dt { font-size: 12px; line-height: 1; color: var(--c-mute); margin-top: 14px; }
.nw2__main h3 { font-size: 32px; font-weight: 900; line-height: 1.3; margin-top: 12px; }

.nw2__list { flex: 1; }
.nw2__list li { border-bottom: 1px solid var(--c-line); padding-bottom: 18px; margin-bottom: 25px; }
.nw2__list .dt { font-size: 12px; line-height: 1; color: var(--c-mute); }
.nw2__list .tg {
  display: inline-block; font-size: 10px; font-weight: 600; line-height: 1.6;
  border: 1px solid var(--c-line); padding: 1px 8px; margin-left: 10px; color: var(--c-mute);
}
.nw2__list h4 { font-size: 15px; font-weight: 600; line-height: 1.75; margin-top: 8px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf nw2">

    <div class="wf__inner nw2__wrap">
      <div class="nw2__sh">
        <p class="e en">DUMMY / TEXT</p>
        <p class="j">ダミー見出し</p>
      </div>

      <div class="nw2__cols">
        <!-- 主記事 -->
        <div class="nw2__main">
          <div class="ph img" data-l="THUMB"></div>
          <p class="dt en">2026/07/16</p>
          <h3>ダミーテキストダミーテキストダミーテキスト - ダミーテキストダミーテキスト -</h3>
        </div>

        <!-- 一覧 -->
        <ul class="nw2__list">
          <li><span class="dt en">2026/06/21</span><span class="tg">ダミー</span><h4>ダミーテキストダミーテキストダミーテキスト</h4></li>
          <li><span class="dt en">2026/06/30</span><span class="tg">ダミー名</span><h4>ダミーテキストダミーテキストダミー</h4></li>
          <li><span class="dt en">2026/03/17</span><span class="tg">ダミー</span><h4>ダミーテキストダミーテキストダミーテキストダミー</h4></li>
          <li><span class="dt en">2026/02/28</span><span class="tg">ダミー名</span><h4>ダミーテキストダミーテキストダミーテキスト</h4></li>
          <li><span class="dt en">2026/01/15</span><span class="tg">ダミー</span><h4>ダミーテキストダミー</h4></li>
        </ul>
      </div>
    </div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
