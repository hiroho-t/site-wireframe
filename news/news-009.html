<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news-009</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   09 NEWS / 左にカテゴリフィルタ、右にサムネ付きの一覧
   URLからDOM実測（1440幅・元セクション高1109 → 800に収めるため一覧を3件に）
   英字 56px/400 ＋ 和文 16px/600 ／ フィルタ 14px/400（ピッチ54.5）
   一覧：サムネ158×118 ＋ 日付14px ＋ カテゴリ14px ＋ タイトル16px lh25.6、ピッチ185
   ============================================================ */
.nw9 { background: var(--c-bg-gray); }
.nw9__head { position: absolute; left: 80px; top: 82px; display: flex; align-items: baseline; }
.nw9__en { font-size: 56px; font-weight: 400; line-height: 56px; letter-spacing: .01em; }
.nw9__jp { margin-left: 14px; font-size: 16px; font-weight: 600; line-height: 25.6px; }

.nw9__filter { position: absolute; left: 80px; top: 235px; }
.nw9__filter li { height: 54.5px; font-size: 14px; line-height: 38px; color: var(--c-sub); }
.nw9__filter li.on { font-weight: 700; color: var(--c-text); }

.nw9__list { position: absolute; left: 521px; top: 227px; width: 847px; }
.nw9__item { display: flex; gap: 25px; margin-bottom: 67px; }
.nw9__item .ph { width: 158px; height: 118px; flex-shrink: 0; }
.nw9__item .meta { display: flex; gap: 16px; font-size: 14px; line-height: 22.4px; color: var(--c-mute); }
.nw9__item h3 { margin-top: 8px; font-size: 16px; line-height: 25.6px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf nw9">
    <div class="nw9__head">
      <span class="nw9__en en">Topics</span>
      <span class="nw9__jp">ダミー項目名</span>
    </div>

    <ul class="nw9__filter">
      <li class="on en">All</li>
      <li>ダミーテキスト項目名</li>
      <li class="en">Information</li>
      <li class="en">CSR</li>
      <li class="en">Works</li>
    </ul>

    <div class="nw9__list">
      <div class="nw9__item">
        <div class="ph img" data-l="THUMB"></div>
        <div><div class="meta"><span class="en">2026.08.10</span><span class="en">Information</span></div>
          <h3>ダミーテキストのお知らせ</h3></div>
      </div>
      <div class="nw9__item">
        <div class="ph img" data-l="THUMB"></div>
        <div><div class="meta"><span class="en">2026.08.04</span><span class="en">Information</span></div>
          <h3>ダミーテキストダミーテキストとダミーテキストダミーテキストのダミーテキストについて</h3></div>
      </div>
      <div class="nw9__item">
        <div class="ph img" data-l="THUMB"></div>
        <div><div class="meta"><span class="en">2026.07.22</span><span class="en">CSR</span></div>
          <h3>ダミーテキストダミーテキストのお知らせ</h3></div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
