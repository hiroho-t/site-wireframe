<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>news-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   05 NEWS / 左にラベル＋英字見出し＋丸矢印つきリンク、右に一覧4件
   実測（1440基準）英字見出し 46px ／ 一覧1行 84px・下1px罫線
   行内：日付14px＋角丸タグ、タイトル16px、右端に丸矢印
   ============================================================ */
.nw5 { background: var(--c-white); }
.nw5__side { position: absolute; left: var(--wf-pad); top: 250px; width: 300px; }
.nw5__lab { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--c-sub); }
.nw5__lab i { font-size: 8px; color: var(--c-mute); }
.nw5__ttl { margin-top: 18px; font-size: 46px; font-weight: 700; line-height: 1.1; }
.nw5__more { margin-top: 46px; display: flex; align-items: center; gap: 18px; font-size: 14px; font-weight: 700; }
.nw5__more .cir {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--c-black); color: var(--c-white);
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}

.nw5__list { position: absolute; left: 440px; top: 232px; width: 928px; border-top: 1px solid var(--c-line); }
.nw5__list li { height: 84px; display: flex; align-items: center; border-bottom: 1px solid var(--c-line); }
.nw5__list .bd { flex: 1; }
.nw5__list .hd { display: flex; align-items: center; gap: 14px; }
.nw5__list .dt { font-size: 14px; color: var(--c-mute); }
.nw5__list .tg { border: 1px solid var(--c-line); border-radius: 12px; padding: 1px 12px; font-size: 12px; color: var(--c-sub); }
.nw5__list h4 { margin-top: 8px; font-size: 16px; font-weight: 500; }
.nw5__list .ar { font-size: 14px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf nw5">
    <div class="nw5__side">
      <p class="nw5__lab"><i class="fa-solid fa-circle"></i>ダミー</p>
      <h2 class="nw5__ttl en">Dummy</h2>
      <div class="nw5__more">ダミーテキスト一覧 <span class="cir"><i class="fa-solid fa-arrow-right"></i></span></div>
    </div>
    <ul class="nw5__list">
      <li><div class="bd"><div class="hd"><span class="dt en">2026.06.19</span></div><h4>ダミーテキストに関するお知らせ</h4></div><i class="ar fa-solid fa-arrow-right"></i></li>
      <li><div class="bd"><div class="hd"><span class="dt en">2026.04.16</span><span class="tg">ダミー項目</span></div><h4>ダミーテキストダミーテキストダミー</h4></div><i class="ar fa-solid fa-arrow-right"></i></li>
      <li><div class="bd"><div class="hd"><span class="dt en">2025.06.23</span><span class="tg">ダミー項目</span></div><h4>ダミーテキストに関するお知らせ</h4></div><i class="ar fa-solid fa-arrow-right"></i></li>
      <li><div class="bd"><div class="hd"><span class="dt en">2025.04.22</span><span class="tg">ダミー項目</span></div><h4>ダミーテキストダミーテキストダミー</h4></div><i class="ar fa-solid fa-arrow-right"></i></li>
    </ul>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
