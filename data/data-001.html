<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>data-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 DATA / 数字で見るセクション。見出し＋大きな数字のブロック
   URLからDOM実測（1440幅・元セクション高1300 → 800に収めるため2ブロックに絞る）
   見出し 英字14/500 → 和文28/600 lh42 → 本文14/400
   ブロック 見出し16/600 ／ 単位24/500 lh36 ／ 数字60/600 ／ 注記13/500
   ============================================================ */
.dt { background: var(--c-bg-gray); }
.dt__head { top: 127px; }
.dt__en { font-size: 14px; font-weight: 500; line-height: 14px; }
.dt__ttl { margin-top: 11px; font-size: 28px; font-weight: 600; line-height: 42px; }
.dt__lead { margin-top: 23px; font-size: 14px; line-height: 22.4px; color: var(--c-sub); }

.dt__blocks { position: absolute; left: var(--wf-pad); top: 317px; width: var(--wf-content); display: flex; }
.dt__b { width: 903px; }
.dt__b h3 { font-size: 16px; font-weight: 600; line-height: 24px; }
.dt__num { display: flex; align-items: baseline; gap: 12px; margin-top: 34px; }
.dt__num .u { font-size: 24px; font-weight: 500; line-height: 36px; }
.dt__num .n { font-size: 60px; font-weight: 600; line-height: 60px; }
.dt__note { display: block; font-size: 13px; font-weight: 500; line-height: 19.5px; color: var(--c-mute); }
.dt__ph1 { position: absolute; left: 502px; top: 411px; width: 310px; height: 206px; }
.dt__ph2 { position: absolute; left: 1048px; top: 516px; width: 200px; height: 133px; }
.dt__src { position: absolute; left: 794px; top: 658px; font-size: 12px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf dt">
    <div class="wf__inner dt__head">
      <p class="dt__en en">Company Data</p>
      <p class="dt__ttl">ダミーテキストで見るダミー</p>
      <p class="dt__lead">ダミーテキストダミーテキストの実績など、ダミーテキストを通してダミーテキストをご紹介します。</p>
    </div>

    <div class="dt__blocks">
      <div class="dt__b">
        <h3>ダミー項目名</h3>
        <div class="dt__num"><span class="u">ダミー</span><span class="n en">000</span><span class="u">名</span></div>
        <div class="dt__num">
          <span class="u">ダミー</span>
          <span><span class="n en">0000</span><span class="dt__note">（ダミーテキスト含む）</span></span>
          <span class="u">名</span>
        </div>
      </div>
      <div class="dt__b">
        <h3>ダミー項目</h3>
        <div class="dt__num"><span class="u">ダミー</span><span class="n en">000</span><span class="u">ダミー</span></div>
      </div>
    </div>

    <div class="dt__ph1 img" data-l="GRAPHIC"></div>
    <div class="dt__ph2 img" data-l="GRAPHIC"></div>
    <p class="dt__src en">※ 20XX.00 現在</p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
