<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>concept-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 CONCEPT / 英字ラベル＋大リード3行＋下段の左右2カラム
   LABEL  16px/700（Poppins）
   LEAD   36px/600 lh1.5 の3行。強調部分だけグレーに落とす
   BOTTOM 左に小見出し、右に補足テキスト（幅403）
   ============================================================ */
.cc { background: var(--c-white); }
.cc__body { top: 242px; }
.cc__lab { font-size: 16px; font-weight: 700; line-height: 1; color: var(--c-mute); margin-bottom: 30px; }
.cc__lead { font-size: 36px; font-weight: 600; line-height: 1.5; padding-bottom: 60px; }
.cc__lead em { font-style: normal; color: var(--c-mute); }
.cc__btm { display: flex; justify-content: space-between; gap: 40px; align-items: flex-start; }
.cc__btm .l { font-size: 16px; font-weight: 700; line-height: 1; color: var(--c-mute); flex-shrink: 0; }
.cc__btm .r { font-size: 16px; font-weight: 600; line-height: 1.5; width: 403px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf cc">

    <div class="wf__inner cc__body">
      <p class="cc__lab en">DUMMY</p>
      <p class="cc__lead">
        ダミーテキストダミーテキストダミーテキストを<br>
        <em>「ダミーのテキストが入りますダミーテキストです」</em>として捉え、<br>
        ダミーテキストダミーテキストダミーテキストを目指します。
      </p>
      <div class="cc__btm">
        <span class="l">ダミー見出し名</span>
        <span class="r">ダミーテキスト，ダミー，ダミーテキスト.ダミーテキストダミー，ダミー</span>
      </div>
    </div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
