<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>about-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   05 ABOUT / 英字ラベル＋48pxの和文見出し。下は左に大きな画像、右に見出し＋本文＋リンク
   URLからDOM実測（1440幅・元セクション高1376 → 800に収めるため画像を縮小）
   ラベル 20px/700 ／ 見出し 48px/700 lh84 ／ 右見出し 35px/700 lh58.75（幅517）
   本文 14px/400 lh31.8 ／ リンク 21px/700
   ============================================================ */
.ab5 { background: var(--c-bg-gray); }
.ab5__head { position: absolute; left: 0; top: 62px; width: 1440px; text-align: center; }
.ab5__en { font-size: 20px; font-weight: 700; line-height: 20px; }
.ab5__ttl { margin-top: 8px; font-size: 48px; font-weight: 700; line-height: 84px; }

.ab5__ph { position: absolute; left: 0; top: 226px; width: 700px; height: 500px; }
.ab5__tx { position: absolute; left: 800px; top: 226px; width: 517px; }
.ab5__lead { font-size: 35px; font-weight: 700; line-height: 58.75px; }
.ab5__body { margin-top: 26px; font-size: 14px; line-height: 31.8px; color: var(--c-sub); }
.ab5__links { margin-top: 34px; }
.ab5__links li { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; font-size: 21px; font-weight: 700; line-height: 20.7px; }
.ab5__links i { font-size: 12px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf ab5">
    <div class="ab5__head">
      <p class="ab5__en en">About us</p>
      <h2 class="ab5__ttl">ダミーテキストについて</h2>
    </div>

    <div class="ab5__ph img" data-l="IMAGE"></div>
    <div class="ab5__tx">
      <p class="ab5__lead">ダミーテキストは、ダミーテキストに新たなダミーテキストを創る</p>
      <p class="ab5__body">「ダミーテキストでダミーテキストを高める」をダミーテキストに、ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストしています。</p>
      <ul class="ab5__links">
        <li>ダミーテキストのこと <i class="fa-solid fa-arrow-right"></i></li>
        <li>ダミーテキストで見るダミー <i class="fa-solid fa-arrow-right"></i></li>
      </ul>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
