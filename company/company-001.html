<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 COMPANY / 左に見出し・リード・リンクリスト、右に大きな画像
   実測（1440基準）
   TITLE 英字70px/700 ／ 和文見出し 30px lh42.5 の2行 ／ リード 18px lh34 の2行
   LIST  1行103px。サムネ70×70（r6）＋和文20px＋英字14px＋右に矢印、下1px罫線
   PHOTO 右に幅650の画像枠
   ============================================================ */
.cp { background: var(--c-white); }
.cp__left { position: absolute; left: var(--wf-pad); top: 55px; width: 636px; }
.cp__label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; line-height: 1; color: var(--c-sub); }
.cp__label i { font-size: 11px; color: var(--c-mute); }
.cp__ttl { font-size: 70px; font-weight: 700; line-height: 1.1; margin-top: 20px; }
.cp__lead { margin-top: 38px; font-size: 30px; font-weight: 700; line-height: 42.5px; }
.cp__note { margin-top: 32px; font-size: 18px; line-height: 34px; color: var(--c-sub); }

.cp__list { margin-top: 46px; }
.cp__list li {
  display: flex; align-items: center; gap: 26px;
  height: 103px; border-bottom: 1px solid var(--c-line);
}
.cp__list .th { width: 70px; height: 70px; border-radius: 6px; flex-shrink: 0; }
.cp__list .tx .j { font-size: 20px; font-weight: 700; line-height: 1.5; }
.cp__list .tx .e { font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--c-mute); }
.cp__list .ar { margin-left: auto; font-size: 14px; color: var(--c-sub); }

.cp__photo { position: absolute; left: 741px; top: 95px; width: 627px; height: 600px; border-radius: 12px 0 0 12px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf cp">

    <div class="cp__left">
      <p class="cp__label"><i class="fa-solid fa-circle"></i>ダミーのラベル</p>
      <h2 class="cp__ttl en">Company</h2>
      <p class="cp__lead">ダミーテキストダミーに、<br>ダミーテキストダミーテキスト。</p>
      <p class="cp__note">ダミーテキストダミーテキストダミーテキストが、<br>ダミーテキストダミーテキストダミーテキスト。</p>

      <ul class="cp__list">
        <li>
          <span class="th img"></span>
          <span class="tx"><span class="j">ダミー項目名</span><br><span class="e en">Dummy</span></span>
          <i class="ar fa-solid fa-arrow-right"></i>
        </li>
        <li>
          <span class="th img"></span>
          <span class="tx"><span class="j">ダミー項目</span><br><span class="e en">Dummy</span></span>
          <i class="ar fa-solid fa-arrow-right"></i>
        </li>
        <li>
          <span class="th img"></span>
          <span class="tx"><span class="j">ダミー項目名称</span><br><span class="e en">Dummy</span></span>
          <i class="ar fa-solid fa-arrow-right"></i>
        </li>
      </ul>
    </div>

    <div class="cp__photo img" data-l="IMAGE"></div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
