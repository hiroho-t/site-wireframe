<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   04 COMPANY / 左に画像を2枚ずらして重ね、右に下罫線のリンク行6本
   URLからDOM実測（1440幅・元セクション高1113 → 800に収めるため画像とピッチを縮小）
   リンク行 20px/700 lh26・ピッチ70、右端に丸アイコン24
   画像 509×520（主）＋ 290×340（重ね）
   ============================================================ */
.cp4 { background: var(--c-bg-gray); }
.cp4__phA { position: absolute; left: 189px; top: 86px; width: 509px; height: 520px; }
.cp4__phB { position: absolute; left: 80px; top: 376px; width: 290px; height: 340px; }

.cp4__list { position: absolute; left: 851px; top: 128px; width: 399px; }
.cp4__list li {
  display: flex; align-items: center; justify-content: space-between;
  height: 70px; border-bottom: 1px solid var(--c-line);
  font-size: 20px; font-weight: 700; line-height: 26px;
}
.cp4__list .cir {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--c-sub);
}
.cp4__link { position: absolute; left: 1068px; top: 612px; display: flex; align-items: center; gap: 22px; font-size: 18px; font-weight: 700; }
.cp4__link .cir {
  width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf cp4">
    <div class="cp4__phA img" data-l="IMAGE"></div>
    <div class="cp4__phB img" data-l="IMAGE"></div>

    <ul class="cp4__list">
      <li>ダミー項目 <span class="cir"><i class="fa-solid fa-arrow-right"></i></span></li>
      <li>ダミー項目名称 <span class="cir"><i class="fa-solid fa-arrow-right"></i></span></li>
      <li>ダミー項目名 <span class="cir"><i class="fa-solid fa-arrow-right"></i></span></li>
      <li>ダミー項目名 <span class="cir"><i class="fa-solid fa-arrow-right"></i></span></li>
      <li>ダミー項目名 <span class="cir"><i class="fa-solid fa-arrow-right"></i></span></li>
      <li class="en">DUMMY <span class="cir"><i class="fa-solid fa-arrow-right"></i></span></li>
    </ul>

    <p class="cp4__link"><span class="en">COMPANY</span><span class="cir"><i class="fa-solid fa-arrow-right"></i></span></p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
