<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>career-002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 CAREER / 左に濃色パネル（ラベル＋見出し2行＋本文＋白ボタン）、右に画像のカード
   実測（1440基準）カード 全幅1296・高さ420 ／ 左パネル 幅620
   見出し 28px lh1.5 ／ 本文 15px lh30 ／ ボタン 200×56（白・角丸4）
   パネルを濃色にするのは、白抜き文字を成立させるため（視認性の例外）
   ============================================================ */
.cr2 { background: var(--c-white); }
.cr2__card {
  position: absolute; left: var(--wf-pad); top: 165px;
  width: var(--wf-content); height: 470px;
  border-radius: 10px; overflow: hidden; display: flex;
}
.cr2__panel {
  width: 620px; flex-shrink: 0; padding: 56px 60px;
  background: #2a2a2c; color: var(--c-white);
}
.cr2__lab { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }
.cr2__lab i { font-size: 8px; }
.cr2__ttl { margin-top: 22px; font-size: 28px; font-weight: 700; line-height: 1.5; }
.cr2__body { margin-top: 26px; font-size: 15px; line-height: 30px; color: rgba(255,255,255,.9); }
.cr2__btn {
  margin-top: 34px; width: 200px; height: 56px; border-radius: 4px;
  background: var(--c-white); color: var(--c-text);
  display: flex; align-items: center; justify-content: center; gap: 22px;
  font-size: 15px; font-weight: 700;
}
.cr2__ph { flex: 1; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf cr2">
    <div class="cr2__card">
      <div class="cr2__panel">
        <p class="cr2__lab"><i class="fa-solid fa-circle"></i><span class="en">Dummy</span></p>
        <h2 class="cr2__ttl">ダミーテキストへ<br>ダミーテキスト</h2>
        <p class="cr2__body">
          ダミーテキストダミーテキストダミーテキスト、ダミー<br>
          ダミーテキストダミーテキストダミーテキストダミー<br>
          ダミーテキストダミーテキストダミーテキストダミー<br>
          ダミーテキストダミーテキストダミーテキストませ<br>
          んか？
        </p>
        <div class="cr2__btn">ダミーボタン <i class="fa-solid fa-arrow-up-right-from-square"></i></div>
      </div>
      <div class="cr2__ph img" data-l="IMAGE"></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
