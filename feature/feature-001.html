<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feature-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 FEATURE / ラベル＋和文大見出し、下に左：円形の画像／右：本文＋角丸ボタン
   実測（1440基準）ラベル 14px（先頭ドット）／ 見出し 40px
   画像 φ430 ／ 右本文 left500 幅640・15px lh30 ／ ボタン 290×62 r10
   ============================================================ */
.fe { background: var(--c-white); }
.fe__head { top: 96px; }
.fe__lab { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--c-sub); }
.fe__lab i { font-size: 8px; color: var(--c-mute); }
.fe__ttl { margin-top: 22px; font-size: 40px; font-weight: 700; line-height: 1.3; }

.fe__ph { position: absolute; left: 300px; top: 268px; width: 430px; height: 430px; border-radius: 50%; }
.fe__body { position: absolute; left: 500px; top: 300px; width: 660px; }
.fe__body p { font-size: 15px; line-height: 30px; }
.fe__body .btn-black { margin-top: 40px; width: 290px; height: 62px; border-radius: 10px; font-size: 16px; font-weight: 700; }
.fe__body .btn-black i { margin-left: 22px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf fe">
    <div class="wf__inner fe__head">
      <p class="fe__lab"><i class="fa-solid fa-circle"></i><span class="en">Dummy</span></p>
      <h2 class="fe__ttl">ダミーテキストダミーテキスト</h2>
    </div>

    <div class="fe__ph img" data-l="IMAGE"></div>
    <div class="fe__body">
      <p>
        ダミーテキストダミーテキストダミーテキストダミーテキストで、<br>
        ダミーテキスト、ダミーテキスト、ダミーテキストなど、<br>
        ダミーテキストダミーテキストで使用されています。<br>
        ダミーテキストダミーテキストダミーテキストされ、<br>
        ダミーテキストダミーテキストに「ダミーテキストダミー」<br>
        であることが求められます。<br>
        ダミーテキストダミーテキストダミーの結果、<br>
        ダミーテキストダミーテキストダミーテキストに至っているのです。
      </p>
      <div class="btn-black">ダミーボタン <i class="fa-solid fa-arrow-right"></i></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
