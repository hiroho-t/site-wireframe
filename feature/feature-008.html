<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feature-008</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   08 FEATURE / 左に大きな画像、右に小ラベル＋40pxの見出し＋本文＋ボタン
   URLからDOM実測（1440幅・元セクション高769を800の中央に配置）
   小ラベル 14px/500 ／ 見出し 40px/600 lh60 の2行 ／ 本文 15px/500 lh33
   画像 663×609 ／ ボタン 16px/500
   ============================================================ */
.fe8 { background: var(--c-bg-gray); }
.fe8__ph { position: absolute; left: 50px; top: 96px; width: 663px; height: 609px; border-radius: 12px; }
.fe8__tx { position: absolute; left: 785px; top: 160px; width: 555px; }
.fe8__lab { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--c-mute); }
.fe8__ttl { margin-top: 12px; font-size: 40px; font-weight: 600; line-height: 60px; }
.fe8__body { margin-top: 20px; font-size: 15px; font-weight: 500; line-height: 33px; color: var(--c-sub); }
.fe8__btn {
  margin-top: 38px; height: 52px; width: 210px; border-radius: 26px;
  border: 1px solid var(--c-line); background: var(--c-white);
  display: flex; align-items: center; justify-content: center; gap: 16px;
  font-size: 16px; font-weight: 500;
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf fe8">
    <div class="fe8__ph img" data-l="IMAGE"></div>
    <div class="fe8__tx">
      <p class="fe8__lab en">For Work<br>For Life</p>
      <h2 class="fe8__ttl">ダミーの「ダミー」を、<br>ダミーテキストで支える。</h2>
      <p class="fe8__body">
        「ダミーテキストがしたい」「ダミーテキストを描きたい」<br>
        ダミーテキストの「ダミー」を、ダミーテキストで支える。<br>
        ダミーテキストのダミーテキストにしか「ダミー」はないと、<br>
        ダミーテキストは知っているから。<br>
        ダミーテキストとしての、ダミーテキストとしての、<br>
        ダミーテキストをダミーテキストでありたい。
      </p>
      <div class="fe8__btn">ダミーテキストを知る <i class="fa-solid fa-arrow-right"></i></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
