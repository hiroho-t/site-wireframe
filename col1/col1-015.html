<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col1-015</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   1カラム / 見出し＋「◯◯から探す」のタグ群を2グループ並べる絞り込みブロック
   参考サイトのHTMLをDOM実測（1440幅）
   グループ見出し 19px/700 ／ タグ 高さ30・14px・枠線＋角丸15、gap 8
   イベントや講座を条件で探させるときに使う
   ============================================================ */
.col1_015 { background: var(--c-bg-gray); }
.col1_015__head { top: 214px; }
.col1_015__en { display: flex; align-items: baseline; gap: 14px; }
.col1_015__en b { font-size: 31px; font-weight: 700; line-height: 1; }
.col1_015__en span { font-size: 14px; }
.col1_015__lead { margin-top: 24px; font-size: 19px; font-weight: 700; line-height: 1.6; }

.col1_015__groups { position: absolute; left: var(--wf-pad); top: 382px; width: var(--wf-content); }
.col1_015__g + .col1_015__g { margin-top: 62px; }
.col1_015__g h3 { font-size: 19px; font-weight: 700; line-height: 27px; }
.col1_015__tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.col1_015__tags span {
  height: 30px; padding: 0 18px; border-radius: 15px;
  border: 1px solid var(--c-line); background: var(--c-white);
  display: inline-flex; align-items: center; font-size: 14px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf col1_015">
    <div class="wf__inner col1_015__head">
      <p class="col1_015__en"><b class="en">Dummy</b><span>ダミー項目名</span></p>
      <p class="col1_015__lead">ダミーテキストダミーテキストに出会える。</p>
    </div>

    <div class="col1_015__groups">
      <div class="col1_015__g">
        <h3>ダミー項目から探す</h3>
        <div class="col1_015__tags">
          <span>ダミーテキスト項目</span><span>ダミー項目</span><span>ダミーテキスト・ダミー</span>
          <span>ダミー・ダミー</span><span>ダミー項目名</span><span>ダミー項目</span>
        </div>
      </div>
      <div class="col1_015__g">
        <h3>ダミー分類から探す</h3>
        <div class="col1_015__tags">
          <span>ダミー項目</span><span>ダミー名</span><span>ダミー項目名</span>
          <span>ダミーテキスト</span><span>ダミー項目</span><span>ダミー分類名</span>
          <span>ダミー項目</span><span>ダミー</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
