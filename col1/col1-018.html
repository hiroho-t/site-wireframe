<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col1-018</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   01 RECRUIT / 募集要項（職種名＋定義リスト6行＋応募ボタン）
   1行＝項目名200px＋内容。採用サイトの下層に置く募集条件の型
   上下中央（top 155px）
   ============================================================ */
.c1_018 { background: var(--c-white); }
.c1_018__wrap { top: 155px; }
.c1_018__ttl { display: flex; align-items: center; gap: 16px; }
.c1_018__ttl .tag { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; font-size: 12px; font-weight: 500; }
.c1_018__ttl h2 { font-size: 24px; font-weight: 700; line-height: 36px; }
.c1_018__dl { margin-top: 24px; border-top: 1px solid var(--c-line); }
.c1_018__r { display: flex; align-items: center; min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--c-line); }
.c1_018__r dt { width: 200px; flex: none; font-size: 14px; font-weight: 700; line-height: 22px; }
.c1_018__r dd { font-size: 14px; font-weight: 400; line-height: 24px; color: var(--c-sub); }
.c1_018__btn { display: flex; justify-content: center; margin-top: 32px; }
.c1_018__btn .btn-black { width: 300px; height: 56px; gap: 12px; font-size: 15px; font-weight: 700; }
.c1_018__btn i { font-size: 11px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf c1_018">
    <div class="wf__inner c1_018__wrap">
      <div class="c1_018__ttl"><span class="tag tag-gray">ダミー項目</span><h2>ダミーテキストの募集職種名</h2></div>
      <dl class="c1_018__dl">
        <div class="c1_018__r"><dt>ダミー項目名</dt><dd>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストです。</dd></div>
        <div class="c1_018__r"><dt>ダミー項目名</dt><dd>ダミーテキスト（ダミーテキスト）</dd></div>
        <div class="c1_018__r"><dt>ダミー項目名</dt><dd>〒000-0000　ダミーテキスト県ダミー市ダミー町0丁目0-0</dd></div>
        <div class="c1_018__r"><dt>ダミー項目名</dt><dd>00:00〜00:00（休憩00分／実働0時間00分）</dd></div>
        <div class="c1_018__r"><dt>ダミー項目名</dt><dd>月給 000,000円〜000,000円　※ダミーテキストダミーテキスト</dd></div>
        <div class="c1_018__r"><dt>ダミー項目名</dt><dd>ダミーテキスト、ダミーテキスト、ダミーテキスト、ダミーテキスト</dd></div>
      </dl>
      <div class="c1_018__btn"><a class="btn-black" href="#">ダミーテキストする<i class="fa-solid fa-arrow-right"></i></a></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
