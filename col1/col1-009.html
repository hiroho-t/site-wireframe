<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col1-009</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 SERVICE / 左上に見出し、右カラム（73%）にブロックを積む
   見出し  英字90px/700 ＋ 和文14px/700
   ブロック 見出し行（英字52px ＋ 和文14px を gap40 で横並び）→ 番号／タイトル／本文の行リスト
   行内訳  番号 8% ／ タイトル 41% ／ 本文 44%、下罫線＋padding-bottom 32
   ============================================================ */
.col1_009 { background: var(--c-white); }
.col1_009__wrap { top: 86px; }
.col1_009__sh { display: flex; align-items: baseline; gap: 24px; }
.col1_009__sh .e { font-size: 90px; font-weight: 700; line-height: 1.22; }
.col1_009__sh .j { font-size: 14px; font-weight: 700; line-height: 1.5; letter-spacing: .03em; color: var(--c-mute); }

.col1_009__body { width: 73%; margin-left: auto; margin-top: 80px; }
.col1_009__bh { display: flex; align-items: baseline; gap: 40px; margin-bottom: 32px; }
.col1_009__bh .e { font-size: 52px; font-weight: 700; line-height: 1; }
.col1_009__bh .j { font-size: 14px; font-weight: 700; line-height: 1.5; letter-spacing: .03em; color: var(--c-mute); }

.col1_009__cards { display: flex; flex-direction: column; gap: 32px; }
.col1_009__row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 0 32px; border-bottom: 1px solid var(--c-line);
}
.col1_009__row .n { width: 8%; font-size: 32px; font-weight: 700; line-height: 1; color: var(--c-mute); }
.col1_009__row .t { width: 41%; font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: .03em; }
.col1_009__row .d { width: 44%; font-size: 14px; line-height: 1.7; letter-spacing: .03em; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col1_009">

    <div class="wf__inner col1_009__wrap">
      <!-- セクション見出し -->
      <div class="col1_009__sh">
        <p class="e en">DUMMY</p>
        <p class="j">ダミー見出し</p>
      </div>

      <!-- 右カラムのブロック -->
      <div class="col1_009__body">
        <div class="col1_009__bh">
          <span class="e en">DUMMY</span>
          <span class="j">ダミーの小見出しです</span>
        </div>
        <div class="col1_009__cards">
          <div class="col1_009__row">
            <p class="n en">01</p>
            <p class="t">ダミーテキストが<br>入ります</p>
            <p class="d">ダミーテキストダミーテキストダミーテキストダミーテキスト、ダミーテキストダミーテキストダミーテキストです。</p>
          </div>
          <div class="col1_009__row">
            <p class="n en">02</p>
            <p class="t">ダミーのテキスト<br>ダミーです</p>
            <p class="d">ダミーテキストダミーテキストダミーテキスト、ダミーテキストダミーテキストダミーです。</p>
          </div>
          <div class="col1_009__row">
            <p class="n en">03</p>
            <p class="t">ダミーテキスト<br>ダミーテキスト</p>
            <p class="d">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
