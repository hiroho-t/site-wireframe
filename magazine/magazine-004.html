<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magazine-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   04 MAGAZINE / 英字130pxの見出し＋カテゴリ、下に「画像＋日付＋見出し」の記事
   URLからDOM実測（1440幅・元セクション高1105 → 800に収める）
   英字 130px/100 ＋ 和文 20px/300 ／ カテゴリ 16px/300 lh25.6
   画像 434×289 ／ 日付 15px/400 ／ 見出し 20px/600 lh36（幅470）
   ============================================================ */
.mg4 { background: var(--c-white); }
.mg4__head { position: absolute; left: 75px; top: 90px; display: flex; align-items: flex-end; gap: 8px; }
.mg4__en { font-size: 130px; font-weight: 100; line-height: 130px; letter-spacing: .01em; }
.mg4__jp { padding-bottom: 20px; font-size: 20px; font-weight: 300; line-height: 20px; }

.mg4__cat { position: absolute; left: 104px; top: 340px; }
.mg4__cat li { margin-bottom: 26px; font-size: 16px; font-weight: 300; line-height: 25.6px; color: var(--c-sub); }
.mg4__cat li.on { font-weight: 600; color: var(--c-text); }

.mg4__ph { position: absolute; left: 401px; top: 338px; width: 434px; height: 289px; }
.mg4__tx { position: absolute; left: 895px; top: 338px; width: 470px; }
.mg4__tx .dt { font-size: 15px; font-weight: 400; line-height: 15px; color: var(--c-mute); }
.mg4__tx h3 { margin-top: 106px; font-size: 20px; font-weight: 600; line-height: 36px; }
.mg4__all { position: absolute; left: 1099px; top: 680px; display: flex; align-items: center; gap: 16px; font-size: 15px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf mg4">
    <div class="mg4__head">
      <span class="mg4__en en">Column</span>
      <span class="mg4__jp">ダミー項目</span>
    </div>

    <ul class="mg4__cat">
      <li class="on">すべて</li>
      <li>ダミー項目名</li>
      <li>ダミー項目</li>
      <li>ダミー項目名称</li>
    </ul>

    <div class="mg4__ph img" data-l="THUMB"></div>
    <div class="mg4__tx">
      <p class="dt en">2025.04.03</p>
      <h3>ダミーテキストのお話</h3>
    </div>
    <p class="mg4__all"><span class="en">View all</span> <i class="fa-solid fa-arrow-right"></i></p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
