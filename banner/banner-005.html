<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>banner-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   05 BANNER / 縦にずらした3枚の縦長カード。英字50px＋和文14px を画像下に置く
   URLからDOM実測（1440幅・カード 427×420、x 50/507/963、段差80（元は533・段差108／800に収めるため縮小））
   ============================================================ */
.bn5 { background: var(--c-white); }
.bn5__cards { position: absolute; left: 50px; top: 47px; }
.bn5__c { position: absolute; width: 427px; }
.bn5__c .ph { width: 427px; height: 420px; border-radius: 12px; }
.bn5__c .en { margin-top: 26px; font-size: 50px; font-weight: 500; line-height: 65px; }
.bn5__c .jp { margin-top: 4px; font-size: 14px; font-weight: 600; line-height: 18.2px; color: var(--c-sub); }
.bn5__a { left: 0; top: 0; }
.bn5__b { left: 457px; top: 80px; }
.bn5__c3 { left: 913px; top: 160px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf bn5">
    <div class="bn5__cards">
      <div class="bn5__c bn5__a">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="en">Our strength</p>
        <p class="jp">ダミーテキストのダミー</p>
      </div>
      <div class="bn5__c bn5__b">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="en">Advantages</p>
        <p class="jp">ダミーテキストで働くダミーテキスト</p>
      </div>
      <div class="bn5__c bn5__c3">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="en">Questions</p>
        <p class="jp">ダミーテキスト項目</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
