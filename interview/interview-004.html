<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>interview-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   04 INTERVIEW / 英字90pxの見出し＋右上にView All、下に縦長カードを横並び
   URLからDOM実測（1440幅・元セクション高947 → 800に収めるため画像を468→330に）
   英字 90px/500 lh99 ＋ 和文 14px/500 ／ カード 360幅：画像360×330
   見出し 16px/600 lh24 ／ 部署 12px/500 ／ 氏名 18px/500 lh28.8
   スライダーは動かさず静止した状態で見せる
   ============================================================ */
.iv4 { background: var(--c-white); }
.iv4__head { position: absolute; left: 50px; top: 70px; }
.iv4__en { font-size: 90px; font-weight: 500; line-height: 99px; letter-spacing: .01em; }
.iv4__jp { font-size: 14px; font-weight: 500; line-height: 19.6px; color: var(--c-sub); }
.iv4__all {
  position: absolute; right: 50px; top: 108px;
  height: 52px; padding: 0 28px; border-radius: 26px; border: 1px solid var(--c-line);
  display: flex; align-items: center; gap: 16px; font-size: 16px; font-weight: 500;
}

.iv4__cards { position: absolute; left: 50px; top: 290px; display: flex; gap: 40px; }
.iv4__card { width: 360px; }
.iv4__card .ph { width: 360px; height: 330px; border-radius: 8px; }
.iv4__card h3 { margin-top: 26px; width: 272px; font-size: 16px; font-weight: 600; line-height: 24px; }
.iv4__card .dep { margin-top: 16px; font-size: 12px; font-weight: 500; line-height: 14.4px; color: var(--c-mute); }
.iv4__card .nm { margin-top: 4px; font-size: 18px; font-weight: 500; line-height: 28.8px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf iv4">
    <div class="iv4__head">
      <p class="iv4__en en">Interview</p>
      <p class="iv4__jp">ダミーテキストダミー</p>
    </div>
    <div class="iv4__all"><span class="en">View All</span> <i class="fa-solid fa-arrow-right"></i></div>

    <div class="iv4__cards">
      <div class="iv4__card">
        <div class="ph img" data-l="PORTRAIT"></div>
        <h3>ダミーテキストこそ全て？ダミーテキストにダミーテキストできるダミー</h3>
        <p class="dep">ダミーチーム ダミーコンサルタント</p>
        <p class="nm">ダミー 太郎</p>
      </div>
      <div class="iv4__card">
        <div class="ph img" data-l="PORTRAIT"></div>
        <h3>ダミーテキスト大好き！ダミーテキストになり始めたらダミーテキスト</h3>
        <p class="dep">ダミーコンサルタント</p>
        <p class="nm">ダミー 花子</p>
      </div>
      <div class="iv4__card">
        <div class="ph img" data-l="PORTRAIT"></div>
        <h3>ダミーテキストダミーテキスト。ダミーテキストダミーテキストダミー</h3>
        <p class="dep">ダミーチーム ダミーテキスト</p>
        <p class="nm">ダミー 一郎</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
