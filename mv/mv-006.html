<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv-006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   06 MV / 左上に白いロゴブロック、グレーのピルナビ＋言語ボタン。濃色の全面ビジュアル
   実測（1440基準）ヘッダー 高さ122。ロゴブロック 260×122（白）
   ピルナビ 高さ56 r28・項目15px gap34 ／ 言語ボタン 128×56 r28
   コピー 和文28px、中央にロゴ枠 460×120
   背景を濃色にするのは、白抜き文字を成立させるため（視認性の例外）
   ============================================================ */
.mv6 { background: #2a2a2c; color: var(--c-white); }
.mv6__hd { position: absolute; left: 0; top: 0; width: 1440px; height: 122px; display: flex; align-items: center; }
.mv6__logo {
  width: 260px; height: 122px; flex-shrink: 0;
  background: var(--c-white); color: var(--c-text);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; letter-spacing: .06em;
}
.mv6__nav {
  margin-left: 34px; height: 56px; border-radius: 28px;
  background: rgba(255,255,255,.12);
  display: flex; align-items: center; gap: 34px; padding: 0 30px;
  font-size: 15px; font-weight: 500;
}
.mv6__lang {
  margin-left: auto; margin-right: var(--wf-pad);
  width: 128px; height: 56px; border-radius: 28px;
  background: var(--c-white); color: var(--c-text);
  display: flex; align-items: center; justify-content: center; gap: 12px;
  font-size: 15px; font-weight: 700;
}
.mv6__copy { position: absolute; left: 0; width: 1440px; top: 330px; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: .06em; }
.mv6__mark { position: absolute; left: 0; top: 420px; width: 1440px; text-align: center; font-size: 72px; font-weight: 700; line-height: 120px; letter-spacing: .12em; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf mv6">
    <header class="mv6__hd">
      <div class="mv6__logo en">LOGO</div>
      <nav class="mv6__nav">
        <span>ダミー項目について</span>
        <span>ダミー・ダミー項目</span>
        <span>ダミー項目名</span>
        <span>ダミー項目</span>
        <span>ダミー項目名</span>
        <span>ダミー項目</span>
        <span>ダミー</span>
      </nav>
      <div class="mv6__lang en"><i class="fa-solid fa-globe"></i> JP</div>
    </header>

    <p class="mv6__copy">ダミーテキストダミーテキストは、ダミーテキストだ。</p>
    <div class="mv6__mark en">LOGO</div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
