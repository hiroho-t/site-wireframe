<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv-008</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   08 MV / 角丸でインセットした全面ビジュアルの上にミッションコピー
   URLからDOM実測（1440幅・元セクション高1228 → 800に収める）
   ヘッダー ナビ 15px/500・gap40
   英字ラベル 72px/200 lh61 ／ 和文ラベル 14px/600 ／ コピー 42px/500 lh63
   本文 14px/400 lh28 ／ テキストリンク 14px/500
   ============================================================ */
.mv8 { background: var(--c-white); }
.mv8__hd { top: 0; height: 104px; display: flex; align-items: center; }
.mv8__logo { font-size: 22px; font-weight: 700; letter-spacing: .06em; }
.mv8__nav { margin-left: auto; display: flex; gap: 40px; font-size: 15px; font-weight: 500; }

.mv8__visual {
  position: absolute; left: var(--wf-pad); top: 104px;
  width: var(--wf-content); height: 660px; border-radius: 16px;
}
.mv8__tx { position: absolute; left: 144px; top: 340px; width: 448px; color: var(--c-white); }
.mv8__en { font-size: 72px; font-weight: 200; line-height: 61px; letter-spacing: .02em; }
.mv8__lab { margin-top: 12px; font-size: 14px; font-weight: 600; line-height: 25.2px; }
.mv8__ttl { margin-top: 20px; font-size: 42px; font-weight: 500; line-height: 63px; }
.mv8__body { margin-top: 16px; font-size: 14px; line-height: 28px; }
.mv8__link { margin-top: 34px; display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 500; }
.mv8__link i { font-size: 10px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf mv8">
    <header class="wf__inner mv8__hd">
      <div class="mv8__logo en">LOGO</div>
      <nav class="mv8__nav en">
        <span>Dummy</span><span>Dummy</span><span>Dummy</span>
        <span>Dummy</span><span>Dummy</span><span>Dummy</span><span>Dummy</span>
      </nav>
    </header>

    <div class="mv8__visual img img--dark" data-l="KEY VISUAL"></div>
    <div class="mv8__tx">
      <p class="mv8__en en">Dummy</p>
      <p class="mv8__lab">ダミーのラベルテキスト</p>
      <h1 class="mv8__ttl">ダミーテキスト<br>「ダミー」をつくる</h1>
      <p class="mv8__body">
        ダミーテキストダミーテキストには、ダミーテキストがありながらも、<br>
        ダミーテキストダミーテキストダミーテキストダミーテキストです。
      </p>
      <p class="mv8__link">ダミーテキストについて <i class="fa-solid fa-arrow-right"></i></p>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
