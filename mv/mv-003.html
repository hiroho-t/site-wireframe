<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   03 MV / ヘッダー＋左に大見出し・右にビジュアル・下端にお知らせバー
   実測（1440基準）
   HEADER   高さ101・下1px罫線。ロゴ h29 ／ ナビ16px ／ 言語切替 ／ CTA 148×50 ／ ハンバーガー 80×50
   TITLE    80px/700 lh99 の2行、SUB 19px
   VISUAL   右に大きな画像枠
   NEWSBAR  下端の白パネル 高さ73（ラベル／日付／タグ／タイトル／矢印／カウンター）
   ============================================================ */
.mv3 { background: var(--c-bg-gray); }

/* ヘッダー */
.mv3__hd {
  left: 0; width: 1440px; top: 0; height: 101px;
  padding: 0 var(--wf-pad);
  display: flex; align-items: center;
  border-bottom: 1px solid var(--c-line);
}
.mv3__logo { font-size: 22px; font-weight: 700; letter-spacing: .08em; }
.mv3__nav { margin-left: auto; display: flex; align-items: center; gap: 28px; }
.mv3__nav li { font-size: 16px; font-weight: 500; line-height: 1; display: flex; align-items: center; gap: 6px; }
.mv3__nav li i { font-size: 10px; color: var(--c-mute); }
.mv3__lang {
  display: flex; align-items: center; gap: 10px; margin-left: 28px;
  height: 34px; padding: 0 14px; background: #e8e8e8;
  font-size: 14px; font-weight: 500; line-height: 1;
}
.mv3__lang .off { color: var(--c-mute); }
.mv3__cta { margin-left: 28px; width: 149px; height: 50px; font-size: 15px; font-weight: 700; border-radius: 0; }
.mv3__burger {
  margin-left: 12px; width: 80px; height: 50px; flex-shrink: 0;
  background: var(--c-black); color: var(--c-white);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}

/* ビジュアル */
.mv3__visual { position: absolute; left: 525px; top: 130px; width: 865px; height: 561px; }

/* 見出し */
.mv3__ttl {
  position: absolute; left: var(--wf-pad); top: 400px;
  font-size: 80px; font-weight: 700; line-height: 99px; letter-spacing: .02em;
}
.mv3__sub { position: absolute; left: var(--wf-pad); top: 618px; font-size: 19px; font-weight: 700; line-height: 1.5; }

/* 下端のお知らせバー */
.mv3__bar {
  position: absolute; left: var(--wf-pad); top: 703px;
  width: var(--wf-content); height: 73px;
  background: var(--c-white);
  display: flex; align-items: center; gap: 22px; padding: 0 34px;
  font-size: 15px;
}
.mv3__bar .lb { font-weight: 700; }
.mv3__bar .ln { width: 1px; height: 24px; background: var(--c-line); }
.mv3__bar .dt { font-weight: 500; color: var(--c-sub); }
.mv3__bar .tg { border: 1px solid var(--c-line); padding: 2px 12px; font-size: 13px; font-weight: 600; color: var(--c-sub); }
.mv3__bar .sp { flex: 1; }
.mv3__bar .cn { font-size: 14px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf mv3">

    <!-- ヘッダー -->
    <header class="mv3__hd">
      <div class="mv3__logo en">LOGO</div>
      <ul class="mv3__nav">
        <li>ダミー項目について <i class="fa-solid fa-chevron-down"></i></li>
        <li>ダミー <i class="fa-regular fa-window-restore"></i></li>
        <li>ダミー項目 <i class="fa-solid fa-chevron-down"></i></li>
        <li>ダミー項目</li>
        <li>ダミー名</li>
        <li class="mv3__lang"><span>日本語</span><span class="off en">English</span></li>
        <li class="mv3__cta btn-black">ダミーボタン</li>
        <li class="mv3__burger"><i class="fa-solid fa-bars"></i></li>
      </ul>
    </header>

    <!-- 右のビジュアル -->
    <div class="mv3__visual img" data-l="KEY VISUAL"></div>

    <!-- 見出し -->
    <h1 class="mv3__ttl">ダミーテキスト、<br>ダミーテキストへ。</h1>
    <p class="mv3__sub">ダミーテキストダミーテキストを、ダミーという形で、ダミーの力に変えていく</p>

    <!-- 下端のお知らせバー -->
    <div class="mv3__bar">
      <span class="lb">ダミー</span>
      <span class="ln"></span>
      <span class="dt en">2026.08.03</span>
      <span class="tg en">DUMMY</span>
      <span>ダミーテキストダミーテキスト —— ダミーテキストダミーテキスト。</span>
      <i class="fa-solid fa-arrow-right"></i>
      <span class="sp"></span>
      <span class="cn en">1 / 3</span>
    </div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
