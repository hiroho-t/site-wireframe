<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   05 MV / 上部にロゴ＋白ピルナビ＋言語切替、全面画像に中央寄せの英字大コピー
   実測（1440基準）ロゴ 幅190・h58 ／ 白ピルナビ 高さ58 r29・項目16px gap34
   見出し 英字76px（斜体）2行＋和文20px ／ 右端に縦のドットページャー
   背景は全面画像のためグレーボックス（白抜き文字の視認性確保）
   ============================================================ */
.mv5 { background: var(--c-img-dark); color: var(--c-white); }
.mv5__hd { top: 46px; display: flex; align-items: center; }
.mv5__logo {
  width: 190px; height: 58px; flex-shrink: 0;
  display: flex; align-items: center;
  font-size: 22px; font-weight: 700; letter-spacing: .06em;
}
.mv5__nav {
  margin-left: 62px; height: 58px; border-radius: 29px;
  background: var(--c-white); color: var(--c-text);
  display: flex; align-items: center; gap: 34px; padding: 0 34px;
  font-size: 16px; font-weight: 500;
}
.mv5__nav i { font-size: 10px; margin-left: 6px; color: var(--c-mute); }
.mv5__lang { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.mv5__lang .off { color: rgba(255,255,255,.6); }

.mv5__ttl {
  position: absolute; left: 0; width: 1440px; top: 348px;
  text-align: center; font-size: 76px; font-weight: 700; font-style: italic;
  line-height: 1.18; letter-spacing: .01em;
}
.mv5__sub { position: absolute; left: 0; width: 1440px; top: 545px; text-align: center; font-size: 20px; font-weight: 500; }

.mv5__pager { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 14px; }
.mv5__pager i { font-size: 7px; color: rgba(255,255,255,.55); }
.mv5__pager i.on { color: var(--c-white); font-size: 9px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf mv5">
    <header class="wf__inner mv5__hd">
      <div class="mv5__logo en">LOGO</div>
      <nav class="mv5__nav">
        <span>ダミー項目</span>
        <span>ダミーの項目</span>
        <span>ダミー項目</span>
        <span>ダミー項目</span>
        <span>ダミー名</span>
        <span>ダミー項目 <i class="fa-solid fa-arrow-up-right-from-square"></i></span>
        <span>ダミー項目名</span>
      </nav>
      <div class="mv5__lang en">JA <span class="off">/ EN</span></div>
    </header>

    <h1 class="mv5__ttl en">The Dummy of<br>Global Dummy</h1>
    <p class="mv5__sub">ダミーテキストダミーテキストダミー。</p>

    <div class="mv5__pager">
      <i class="fa-solid fa-circle"></i>
      <i class="fa-solid fa-circle on"></i>
      <i class="fa-solid fa-circle"></i>
      <i class="fa-solid fa-circle"></i>
      <i class="fa-solid fa-circle"></i>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
