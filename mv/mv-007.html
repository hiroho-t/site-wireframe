<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv-007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   07 MV / 全面動画＋左下にコピー画像。上部に固定ヘッダー
   URLからDOM実測（1440幅）
   HEADER ロゴ 250×26（y17）＋英字16/500（y52）／ ナビ 14/500・y29
   COPY   782×60（y636）／ 英字 15/500 lh16.5（y727）
   背景は全面動画のためグレーボックス（白抜き文字の視認性確保）
   ============================================================ */
.mv7 { background: var(--c-img-dark); color: var(--c-white); }
.mv7__hd { position: absolute; left: 0; top: 0; width: 1440px; padding: 0 var(--wf-pad); height: 100px; }
.mv7__logo { position: absolute; left: var(--wf-pad); top: 17px; font-size: 24px; font-weight: 700; letter-spacing: .06em; line-height: 26px; }
.mv7__logo small { display: block; margin-top: 9px; font-size: 16px; font-weight: 500; line-height: 16px; letter-spacing: 0; }
.mv7__nav { position: absolute; left: 571px; top: 29px; display: flex; gap: 22px; font-size: 14px; font-weight: 500; line-height: 22px; }
.mv7__ent { position: absolute; right: var(--wf-pad); top: 33px; font-size: 14px; font-weight: 500; line-height: 14px; }

.mv7__copy { position: absolute; left: var(--wf-pad); top: 630px; width: 782px; font-size: 48px; font-weight: 700; line-height: 60px; letter-spacing: .04em; }
.mv7__en { position: absolute; left: var(--wf-pad); top: 727px; font-size: 15px; font-weight: 500; line-height: 16.5px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf mv7">
    <header class="mv7__hd">
      <div class="mv7__logo en">LOGO<small>Dummy Site</small></div>
      <nav class="mv7__nav">
        <span>ダミー項目名</span>
        <span>ダミーの項目名</span>
        <span>ダミー項目名称</span>
        <span>ダミー項目名称</span>
        <span>ダミー項目</span>
        <span>ダミー名</span>
      </nav>
      <span class="mv7__ent">ダミー項目</span>
    </header>

    <h1 class="mv7__copy">ダミーテキストダミーテキスト。</h1>
    <p class="mv7__en en">Dummy Text of the Catchcopy Line Goes Here</p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
