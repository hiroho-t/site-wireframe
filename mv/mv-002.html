<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv-002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 MV / 中央揃えの大コピー＋下部ティッカー
   HEADER  高さ100・ロゴ左／ナビ＋黒ピルCTAを右
   COPY    64px/600 中央揃え1行 ＋ サブ18px
   TICKER  下部・アイコン付き項目を20px/600で横並び（動かさず中央に静止させた状態）
   ============================================================ */
.mv2 { background: var(--c-white); }

.mv2__hd { top: 0; height: 100px; display: flex; align-items: center; }
.mv2__logo { font-size: 20px; font-weight: 700; letter-spacing: .08em; }
.mv2__nav { margin-left: auto; display: flex; align-items: center; gap: 24px; }
.mv2__nav ul { display: flex; gap: 27px; }
.mv2__nav li, .mv2__nav p { font-size: 14px; line-height: 28px; }
.mv2__btn { width: 128px; height: 40px; font-size: 14px; font-weight: 500; }

.mv2__copy {
  position: absolute; left: 0; width: 1440px; top: 338px;
  text-align: center; font-size: 64px; font-weight: 600;
  line-height: 1.2; letter-spacing: -.02em;
}
.mv2__copy em { font-style: normal; color: var(--c-mute); }
.mv2__sub {
  position: absolute; left: 0; width: 1440px; top: 450px;
  text-align: center; font-size: 18px; line-height: 1.5; color: var(--c-mute);
}

.mv2__tick { position: absolute; left: 0; width: 1440px; top: 696px; height: 30px; overflow: hidden; }
.mv2__tick .run {
  display: flex; gap: 38px; align-items: center; justify-content: center; white-space: nowrap;
  font-size: 20px; font-weight: 600; color: var(--c-mute);
}
.mv2__tick span { display: inline-flex; align-items: center; gap: 8px; }
.mv2__tick i { font-size: 14px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf mv2">

    <!-- ヘッダー -->
    <header class="wf__inner mv2__hd">
      <div class="mv2__logo en">LOGO</div>
      <div class="mv2__nav">
        <ul>
          <li>ダミー項目</li>
          <li>ダミー項目名</li>
          <li>ダミー項目</li>
        </ul>
        <p>ダミー項目名</p>
        <ul>
          <li>ダミー項目</li>
          <li>ダミー項目名称</li>
        </ul>
        <span class="mv2__btn btn-black">ダミーボタン</span>
      </div>
    </header>

    <!-- 中央のキャッチコピー -->
    <p class="mv2__copy"><em>“ダミー”</em>で、ダミーのキャッチコピー。</p>
    <p class="mv2__sub">ダミーのサブコピーがここに1行で入りますダミーテキスト</p>

    <!-- 下部ティッカー -->
    <div class="mv2__tick">
      <div class="run">
        <span><i class="fa-solid fa-hashtag"></i>ダミー項目</span>
        <span><i class="fa-solid fa-user-group"></i>ダミー項目名</span>
        <span><i class="fa-solid fa-arrow-trend-up"></i>ダミー項目</span>
        <span><i class="fa-solid fa-hand"></i>ダミー項目名</span>
        <span><i class="fa-solid fa-laptop"></i>ダミー項目名称</span>
        <span><i class="fa-solid fa-handshake"></i>ダミー項目名称</span>
      </div>
    </div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
