<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mv-014</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   14 MV / 上にヘッダー、左に英字の3行コピー、右に和文リード。下に幅いっぱいのビジュアル
   URLからDOM実測（1440幅・元セクション高1294 → 800に収めるためコピー110→88px・画像770→270に）
   ヘッダー 高さ128。ロゴ144×38（y45）／ 英字ナビ 14px/600（y54）／ Contactボタン 101×31
   英字コピー 88px/200 lh106 ／ 和文リード 23px/300 lh46
   ビジュアル 1380×270（左右余白30）／ 丸ボタン φ150
   ============================================================ */
.mv14 { background: var(--c-white); }
.mv14__hd { position: absolute; left: 0; top: 0; width: 1440px; height: 128px; padding: 0 60px; display: flex; align-items: center; }
.mv14__logo { font-size: 22px; font-weight: 700; letter-spacing: .06em; }
.mv14__nav { margin-left: auto; display: flex; align-items: center; gap: 34px; font-size: 14px; font-weight: 600; }
.mv14__btn {
  margin-left: 40px; width: 101px; height: 31px; border-radius: 16px;
  border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}

.mv14__copy { position: absolute; left: 60px; top: 150px; font-size: 88px; font-weight: 200; line-height: 106px; letter-spacing: .01em; }
.mv14__jp { position: absolute; left: 1007px; top: 155px; width: 373px; font-size: 23px; font-weight: 300; line-height: 46px; }
.mv14__visual { position: absolute; left: 30px; top: 500px; width: 1380px; height: 270px; }
.mv14__cir {
  position: absolute; left: 1147px; top: 425px; width: 150px; height: 150px; border-radius: 50%;
  background: var(--c-black); color: var(--c-white);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 500;
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf mv14">
    <header class="mv14__hd">
      <div class="mv14__logo en">LOGO</div>
      <nav class="mv14__nav en">
        <span>Dummy</span><span>Dummy</span><span>Dummy</span><span>Dummy</span><span>Dummy</span>
        <span class="mv14__btn">Dummy</span>
      </nav>
    </header>

    <h1 class="mv14__copy en">Dummy Text<br>of the<br>Future</h1>
    <p class="mv14__jp">ダミーとダミーテキストで、<br>ダミーテキストを咲かせる。</p>
    <div class="mv14__visual img" data-l="KEY VISUAL"></div>
    <div class="mv14__cir"><i class="fa-solid fa-arrow-right"></i><span>ダミーボタン</span></div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
