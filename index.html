<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code用のデザイン参考集</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff; --ink:#141414; --sub:#767676; --line:#e6e4e2; --field:#f4f3f1; --r:6px }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.9}

  /* PCではタイトルと検索を横並びにして、そのまま追従させる */
  header{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:32px;flex-wrap:wrap;
    padding:18px 32px;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
  h1{font-size:19px;font-weight:700;letter-spacing:.04em;margin-right:auto}
  .tools{display:flex;align-items:center;gap:10px}
  #q{width:280px;height:38px;padding:0 12px;font:inherit;font-size:13px;
    border:1px solid var(--line);border-radius:var(--r);background:var(--field);color:var(--ink)}
  #q:focus{outline:2px solid var(--ink);outline-offset:-1px;background:#fff}
  .ghlink{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;flex:none;
    font-size:12px;font-weight:700;letter-spacing:.02em;text-decoration:none;color:var(--ink);
    border:1px solid var(--line);border-radius:var(--r);background:#fff}
  .ghlink:hover{background:var(--field)}
  .ghlink svg{width:15px;height:15px;fill:currentColor;flex:none}
  #cat{height:38px;max-width:280px;padding:0 10px;font:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--line);border-radius:var(--r);background:#fff}

  main{padding:28px 32px 64px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
  .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .shot{display:block;aspect-ratio:16/10;overflow:hidden;background:var(--field);border-bottom:1px solid var(--line)}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .head{text-decoration:none;color:inherit;display:block}
  .head:hover .name{text-decoration:underline;text-underline-offset:3px}
  .name{font-size:14px;font-weight:700;line-height:1.5}
  .meta{font-size:11px;color:var(--sub);line-height:1.7}
  .sw{display:flex;border-radius:4px;overflow:hidden;height:14px;border:1px solid var(--line)}
  .sw i{min-width:6px;box-shadow:1px 0 0 var(--line) inset}
  .sw i:first-child{box-shadow:none}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tags button{font:inherit;font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:99px;
    padding:2px 8px;line-height:1.6;background:#fff;cursor:pointer}
  .tags button:hover{background:var(--field);color:var(--ink)}
  .act{display:flex;gap:8px;margin-top:auto;padding-top:4px}
  .act button,.act a{flex:1;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;
    font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:var(--r);cursor:pointer;
    text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:#fff}
  .act button:hover{opacity:.78}
  .act button.done{background:#fff;color:var(--ink);border-color:var(--ink)}

  footer{border-top:1px solid var(--line);padding:28px 32px 56px;font-size:12px;color:var(--sub)}
  footer p{max-width:720px}
  footer a{color:var(--ink)}
  .foot-meta{display:flex;gap:20px;align-items:baseline;margin-top:12px}
  .empty{color:var(--sub);font-size:13px;padding:40px 0}

  /* 右下に追従するカテゴリーボタン */
  .menubtn{position:fixed;right:24px;bottom:24px;z-index:30;width:56px;height:56px;border-radius:50%;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .menubtn span,.menubtn span::before,.menubtn span::after{display:block;width:20px;height:1.5px;background:#fff;position:relative}
  .menubtn span::before,.menubtn span::after{content:"";position:absolute;left:0}
  .menubtn span::before{top:-6px} .menubtn span::after{top:6px}
  .menubtn[aria-expanded=true] span{background:transparent}
  .menubtn[aria-expanded=true] span::before{top:0;transform:rotate(45deg)}
  .menubtn[aria-expanded=true] span::after{top:0;transform:rotate(-45deg)}
  /* 右端にくっつく、画面の縦いっぱいの引き出し */
  .catnav{position:fixed;top:0;right:0;bottom:0;z-index:25;width:min(320px,86vw);
    display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line)}
  .catnav[hidden]{display:none}   /* .catnav の display が効いて開きっぱなしになるのを防ぐ */
  .catnav__h{padding:20px 20px 14px;font-size:12px;font-weight:700;letter-spacing:.1em;border-bottom:1px solid var(--line)}
  .catnav__list{overflow:auto;padding:8px 8px 104px}
  .catnav__list button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;font:inherit;font-size:13px;
    padding:7px 10px;border:0;border-radius:var(--r);background:none;color:var(--ink);cursor:pointer;line-height:1.6}
  .catnav__list button:hover{background:var(--field)}
  .catnav__list button[aria-pressed=true]{background:var(--ink);color:#fff}
  .catnav__g{margin:18px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--sub);
    border-top:1px solid var(--line);padding-top:14px}
  .catnav__g:first-of-type{border-top:0;margin-top:8px;padding-top:0}
  .catnav__list b{margin-left:auto;font-weight:400;font-size:11px;color:var(--sub)}
  .catnav__list button[aria-pressed=true] b{color:rgba(255,255,255,.7)}
  @media (max-width:640px){ .menubtn{right:16px;bottom:16px} }
  @media (max-width:640px){ header,.bar,main,footer{padding-left:20px;padding-right:20px} }
</style>
</head>
<body data-base="styles/">

<header>
  <h1>Claude Code用のデザイン参考集</h1>
  <div class="tools">
  <input id="q" type="search" placeholder="サイト名・カテゴリー・印象でしぼる" autocomplete="off">
  <a class="ghlink" href="https://github.com/hiroho-t/site-wireframe/tree/main/styles/s" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    md一覧
  </a>
  </div>
</header>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>見つかりませんでした。</div></main>

<button class="menubtn" id="menubtn" type="button" aria-expanded="false" aria-controls="catnav" aria-label="カテゴリーを開く">
  <span></span>
</button>
<nav class="catnav" id="catnav" aria-label="カテゴリー" hidden>
  <p class="catnav__h">カテゴリー</p>
  <div class="catnav__list" id="catlist"></div>
</nav>

<footer>
  <p>スクリーンショットの掲載を希望されない場合はご連絡ください、確認のうえ削除します。</p>
  <p class="foot-meta"><span>© StartWith Inc.</span><a href="https://startwith.org/" target="_blank" rel="noopener">運営会社</a></p>
</footer>

<script>
const grid = document.getElementById('grid'), q = document.getElementById('q');
const empty = document.getElementById('empty');
let items = [];

// 置き場所が違っても動くように（ルート直下に置くときは data-base="styles/"）
const BASE = document.body.dataset.base || '';
const menubtn = document.getElementById('menubtn'), catnav = document.getElementById('catnav'), catlist = document.getElementById('catlist');
let cat = '';
// mdに書いてあること（実際に計測した値と、引き継いだ業種）だけを分類として出す。
// 動き・制作ツール・見た印象は観察していないので出さない。
const KEEP_GROUPS = ['タイプ', '業種･ジャンル', '色･配色', '書体'];
const KEEP_SLUGS = new Set([
  'jumprate',         // 文字のジャンプ率 … 文字の段を実測している
  'responsive',       // レスポンシブ … 390pxでも測っている
  '1column', '2column',   // カラム数 … セクションの並びで数えている
  'bold-headings', 'thin-headings',   // 見出しの太さ … ウェイトを実測している
  'whitespace',       // 余白多め … セクションの上下余白を実測している
  'dividers',         // セクション区切り … 面の切り替えを実測している
  'card-list',        // カード型UI … 囲みの繰り返しを検出している
]);
const shown = c => KEEP_GROUPS.includes(CATS[c.slug]?.group) || KEEP_SLUGS.has(c.slug);
// 実測から出している印象（ゴシック／余白ひろい／角丸／色つき など）も
// 「特徴･スタイル」の分類として同じ列に並べる
const TAG_GROUP = '特徴･スタイル';
const tagKey = t => 'tag:' + t;

let CATS = {}, GROUPS = [];
Promise.all([
  fetch(BASE + 'data.json').then(r => r.json()),
  fetch(BASE + 'categories.json').then(r => r.json()).catch(() => ({})),
  fetch(BASE + 'groups.json').then(r => r.json()).catch(() => []),
]).then(([d, c, g]) => {
  items = d; CATS = c; GROUPS = g; fillCats();
  const m = /^#c=(.+)$/.exec(location.hash);
  if (m) pick(decodeURIComponent(m[1])); else render();
})
  .catch(() => { grid.innerHTML = '<p class="empty">data.json が読めません。file:// ではなく簡易サーバー経由で開いてください。</p>'; });

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 載っているサイトが実際に持つカテゴリーだけを、件数の多い順に出す
// SANKOU! と同じ大分類（タイプ／業種･ジャンル／…）で並べる
function fillCats() {
  const n = {};
  for (const x of items) {
    for (const c of (x.cats || []).filter(shown)) (n[c.slug] ||= { name: c.name, n: 0, g: CATS[c.slug]?.group, o: CATS[c.slug]?.order }).n++;
    for (const t of x.tags || []) (n[tagKey(t)] ||= { name: t, n: 0, g: TAG_GROUP, o: -1 }).n++;
  }
  const order = [...GROUPS, 'その他'].filter((v, i, a) => a.indexOf(v) === i);
  const bucket = {};
  for (const [slug, c] of Object.entries(n)) {
    (bucket[c.g || 'その他'] ||= []).push({ slug, ...c, o: c.o ?? 9999 });
  }
  const btn = c => `<button data-c="${esc(c.slug)}" aria-pressed="false">${esc(c.name)}<b>${c.n}</b></button>`;
  catlist.innerHTML = `<button data-c="" aria-pressed="true">すべて<b>${items.length}</b></button>`
    + order.filter(g => bucket[g]?.length).map(g =>
        `<p class="catnav__g">${esc(g)}</p>` + bucket[g].sort((a, b) => a.o - b.o || b.n - a.n).map(btn).join('')
      ).join('');
}

function render() {
  const w = q.value.trim().toLowerCase();
  const hit = items.filter(x =>
    (!cat || (cat.startsWith('tag:')
      ? (x.tags || []).includes(cat.slice(4))
      : (x.cats || []).some(k => k.slug === cat))) &&
    (!w || [x.name, x.industry, ...(x.tags || []), ...(x.cats || []).filter(shown).map(k => k.name)]
      .join(' ').toLowerCase().includes(w)));
  empty.hidden = hit.length > 0;
  grid.innerHTML = hit.map(x => `
    <article class="card">
      <a class="shot" href="${BASE}p/${esc(x.slug)}.html">
        <img src="${BASE}shot/${esc(x.slug)}.jpg" alt="${esc(x.name)} のトップページ" loading="lazy">
      </a>
      <div class="body">
        <a class="head" href="${BASE}p/${esc(x.slug)}.html">
          <p class="name">${esc(x.name)}</p>
          <p class="meta">${esc(x.industry || '')}</p>
        </a>
        <div class="sw">${(x.palette || []).map(c => `<i style="background:${esc(c.hex)};flex:${c.pct}"></i>`).join('')}</div>
        <div class="tags">${(x.tags || []).map(t => `<button data-c="${esc(tagKey(t))}">${esc(t)}</button>`).join('')}</div>
        <div class="act">
          <button data-slug="${esc(x.slug)}">mdをコピー</button>
        </div>
      </div>
    </article>`).join('');
}

q.addEventListener('input', render);

const openNav = on => { menubtn.setAttribute('aria-expanded', on); catnav.hidden = !on; };
menubtn.addEventListener('click', () => openNav(menubtn.getAttribute('aria-expanded') !== 'true'));
function pick(c) {
  cat = c;
  catlist.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.c === c));
  openNav(false); render(); scrollTo({ top: 0 });
}
catlist.addEventListener('click', e => {
  const b = e.target.closest('button[data-c]'); if (!b) return;
  pick(b.dataset.c);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') openNav(false); });
document.addEventListener('click', e => {
  if (catnav.hidden) return;
  if (!catnav.contains(e.target) && !menubtn.contains(e.target)) openNav(false);
});

// カードのコピー：md の中身をそのままクリップボードへ（ファイルは作らない）
grid.addEventListener('click', e => {
  const t = e.target.closest('.tags button[data-c]');
  if (!t) return;
  pick(t.dataset.c);
});

grid.addEventListener('click', async e => {
  const b = e.target.closest('button[data-slug]');
  if (!b) return;
  const before = b.textContent;
  try {
    const md = await fetch(BASE + 's/' + b.dataset.slug + '.md').then(r => r.text());
    await navigator.clipboard.writeText(md);
    b.textContent = 'mdをコピーしました'; b.classList.add('done');
  } catch { b.textContent = 'コピーできません'; }
  setTimeout(() => { b.textContent = before; b.classList.remove('done'); }, 1600);
});
</script>
</body>
</html>
