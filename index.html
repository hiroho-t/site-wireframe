<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>site-wireframe｜レイアウト一覧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f0f0f0;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
  header{padding:44px 40px 28px;border-bottom:1px solid #ddd;background:#fff}
  h1{font-size:22px;font-weight:700;letter-spacing:.04em}
  header p{font-size:12px;color:#777;margin-top:10px;line-height:1.9}
  header code{background:#f0f0f0;padding:2px 6px;font-size:11px}

  /* カテゴリーナビ（スクロールで上部に追従） */
  .catnav{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;
    padding:13px 40px;background:rgba(240,240,240,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid #ddd}
  .catnav a{display:inline-flex;align-items:baseline;gap:7px;padding:7px 14px;
    border:1px solid #ccc;background:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;
    color:#1a1a1a;text-decoration:none;transition:border-color .15s}
  .catnav a:hover{border-color:#1a1a1a}
  .catnav a span{font-size:10px;font-weight:400;color:#999;letter-spacing:0}

  main{padding:0 40px 64px}
  section{padding-top:44px;scroll-margin-top:var(--nav,56px)}
  h2{font-size:15px;font-weight:700;letter-spacing:.1em;padding-bottom:14px;border-bottom:1px solid #ccc}
  h2 span{font-size:11px;font-weight:400;color:#999;margin-left:12px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px;margin-top:24px}
  .card{display:block}
  .thumb{position:relative;display:block;width:100%;aspect-ratio:1440/800;background:#fff;border:1px solid #ddd;overflow:hidden}
  .thumb iframe{width:100%;height:100%;border:0;pointer-events:none;display:block}
  .thumb::after{content:"";position:absolute;inset:0}
  .thumb:hover{border-color:#1a1a1a}
  .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;gap:12px}
  .id{display:inline-flex;align-items:baseline;gap:6px;flex:none;
    font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;color:#1a1a1a;
    background:none;border:0;padding:0;cursor:pointer}
  .id i{font-size:9px;color:#aaa;transform:translateY(-1px)}
  .id:hover{text-decoration:underline;text-underline-offset:3px}
  .id:hover i{color:#1a1a1a}
  .id.done{color:#888}
  .id.done i{color:#888}
  .note{font-size:10px;color:#888;white-space:nowrap}

  @media (max-width:900px){
    header{padding:32px 24px 22px}
    main{padding:0 24px 48px}
    .catnav{padding:11px 24px}
  }
</style>
</head>
<body>
<header>
  <h1>site-wireframe｜レイアウト一覧</h1>
  <p>
    Webサイトのセクション単位のワイヤーフレーム集。アートボードは <code>1440 × 800</code> 固定、色は白・黒・グレーのみ、テキストはすべてダミー。<br>
    CSSは各HTMLに直書きしてあるので、1ファイルをそのままコピーして使える。セクションは<strong>カラム数</strong>で分類（<code>pagetitle</code>／<code>mv</code>／<code>news</code>／<code>footer</code> のみ役割別）。共通ルールは <code>SKILL.md</code>、型の選び分けは <code>SELECT.md</code> を参照。
  </p>
</header>
<nav class="catnav" id="catnav"></nav>
<main id="app"></main>

<script>
/* ------------------------------------------------------------
   カテゴリ定義：セクションを追加したら、ここに1行足すだけ
   [表示名, ディレクトリ名, [ファイルID...]]
   ------------------------------------------------------------ */
const DATA = [
  ["下層ページタイトル", "pagetitle", ["pagetitle-001"]],
  ["MV / メインビジュアル", "mv", ["mv-001", "mv-002", "mv-003", "mv-004", "mv-005", "mv-006", "mv-007", "mv-008", "mv-009", "mv-010", "mv-011", "mv-012", "mv-013", "mv-014"]],
  ["1カラム", "col1", [
    "col1-001", "col1-002", "col1-003", "col1-004", "col1-005", "col1-006", "col1-007", "col1-008", "col1-009", "col1-010", "col1-011", "col1-012", "col1-013", "col1-014"
  ]],
  ["2カラム", "col2", [
    "col2-001", "col2-002", "col2-003", "col2-004", "col2-005", "col2-006", "col2-007", "col2-008", "col2-009", "col2-010", "col2-011", "col2-012", "col2-013", "col2-014", "col2-015", "col2-016", "col2-017", "col2-018", "col2-019", "col2-020", "col2-021", "col2-022", "col2-023", "col2-024", "col2-025", "col2-026", "col2-027", "col2-028", "col2-029", "col2-030", "col2-031", "col2-032", "col2-033", "col2-034", "col2-035"
  ]],
  ["3カラム", "col3", [
    "col3-001", "col3-002", "col3-003", "col3-004", "col3-005", "col3-006", "col3-007", "col3-008", "col3-009", "col3-010", "col3-011", "col3-012", "col3-013", "col3-014"
  ]],
  ["4カラム", "col4", [
    "col4-001", "col4-002", "col4-003", "col4-004", "col4-005", "col4-006", "col4-007"
  ]],
  ["5カラム", "col5", [
    "col5-001"
  ]],
  ["お知らせ", "news", ["news-001", "news-002", "news-003", "news-004", "news-005", "news-006", "news-007", "news-008", "news-009", "news-010"]],
  ["フッター", "footer", ["footer-001", "footer-002", "footer-003", "footer-004", "footer-005", "footer-006", "footer-007", "footer-008", "footer-009", "footer-010", "footer-011", "footer-012", "footer-013", "footer-014"]]
];

document.getElementById('app').innerHTML = DATA.map(([label, dir, items]) => `
  <section id="${dir}">
    <h2>${label}<span>${dir}/ ・ ${items.length}種</span></h2>
    <div class="grid">
      ${items.map(id => `
        <div class="card">
          <a class="thumb" href="${dir}/${id}.html" target="_blank" rel="noopener"><iframe src="${dir}/${id}.html" loading="lazy" scrolling="no" title="${id}"></iframe></a>
          <div class="cap">
            <button type="button" class="id" data-id="${id}" title="IDをコピー">${id}<i class="fa-regular fa-copy"></i></button>
            <span class="note">${dir}/${id}.html</span>
          </div>
        </div>`).join('')}
    </div>
  </section>`).join('');

const nav = document.getElementById('catnav');
nav.innerHTML = DATA.map(([label, dir, items]) =>
  `<a href="#${dir}">${label}<span>${items.length}</span></a>`).join('');

// アンカー先が追従ナビに隠れないよう、ナビの実高さを反映
const setNavH = () => document.documentElement.style.setProperty('--nav', nav.offsetHeight + 'px');
addEventListener('resize', setNavH); setNavH();

document.getElementById('app').addEventListener('click', async (e) => {
  const btn = e.target.closest('.id');
  if (!btn) return;
  const id = btn.dataset.id;
  try { await navigator.clipboard.writeText(id); }
  catch { const r = document.createRange(); r.selectNodeContents(btn);
          getSelection().removeAllRanges(); getSelection().addRange(r); }
  btn.classList.add('done');
  btn.innerHTML = 'コピーしました<i class="fa-solid fa-check"></i>';
  setTimeout(() => { btn.classList.remove('done');
    btn.innerHTML = id + '<i class="fa-regular fa-copy"></i>'; }, 1200);
});
</script>
</body>
</html>
