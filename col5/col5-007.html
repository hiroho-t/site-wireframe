<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col5-007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   05 STEP / 見出し上・縦罫線で等分した5カラムのテキスト（画像なし）
   1列＝番号（英字40px）＋見出し18px＋本文14px。5段階のフローに
   上下中央（top 245px）
   ============================================================ */
.c5_007 { background: var(--c-white); }
.c5_007__wrap { top: 245px; }
.c5_007__head { text-align:center; }
.c5_007__head .e { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: .12em; color: var(--c-mute); }
.c5_007__head h2 { margin-top: 10px; font-size: 30px; font-weight: 700; line-height: 44px; letter-spacing: .05em; }
.c5_007__head p { margin-top: 16px; font-size: 15px; font-weight: 400; line-height: 26px; color: var(--c-sub); }
.c5_007__list { display: flex; margin-top: 48px; border-left: 1px solid var(--c-line); }
.c5_007__c { width: 259.2px; padding: 0 20px; border-right: 1px solid var(--c-line); }
.c5_007__c .n { font-size: 40px; font-weight: 300; line-height: 48px; letter-spacing: .04em; color: var(--c-light); }
.c5_007__c h3 { margin-top: 10px; font-size: 18px; font-weight: 700; line-height: 26px; }
.c5_007__c p { margin-top: 10px; font-size: 14px; font-weight: 400; line-height: 24px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf c5_007">
    <div class="wf__inner c5_007__wrap">
      <div class="c5_007__head">
        <p class="e en">DUMMY TEXT</p>
        <h2>ダミーテキスト見出し</h2>
      </div>
      <div class="c5_007__list">
        <div class="c5_007__c"><p class="n en">01</p><h3>ダミーの見出し</h3><p>ダミーテキストダミーテキストダミーテキストです。</p></div>
        <div class="c5_007__c"><p class="n en">02</p><h3>ダミーの見出し</h3><p>ダミーテキストダミーテキストダミーテキストです。</p></div>
        <div class="c5_007__c"><p class="n en">03</p><h3>ダミーの見出し</h3><p>ダミーテキストダミーテキストダミーテキストです。</p></div>
        <div class="c5_007__c"><p class="n en">04</p><h3>ダミーの見出し</h3><p>ダミーテキストダミーテキストダミーテキストです。</p></div>
        <div class="c5_007__c"><p class="n en">05</p><h3>ダミーの見出し</h3><p>ダミーテキストダミーテキストダミーテキストです。</p></div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
