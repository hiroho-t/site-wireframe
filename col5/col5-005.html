<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col5-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   05 SUPPORT / 見出し上・5列×2行の円アイコンカード10件
   カード＝円形アイコン120＋見出し15px（2行）＋補足12px。制度・設備の一覧に
   上下中央（top 99px）
   ============================================================ */
.c5_005 { background: var(--c-white); }
.c5_005__wrap { top: 99px; }
.c5_005__head { text-align:center; }
.c5_005__head .e { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: .12em; color: var(--c-mute); }
.c5_005__head h2 { margin-top: 10px; font-size: 30px; font-weight: 700; line-height: 44px; letter-spacing: .05em; }
.c5_005__head p { margin-top: 16px; font-size: 15px; font-weight: 400; line-height: 26px; color: var(--c-sub); }
.c5_005__list { display: flex; flex-wrap: wrap; gap: 40px 24px; margin-top: 44px; }
.c5_005__c { width: 240px; text-align: center; }
.c5_005__c .ph { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; }
.c5_005__c .tt { margin-top: 14px; font-size: 15px; font-weight: 700; line-height: 22px; }
.c5_005__c p { margin-top: 8px; font-size: 12px; font-weight: 400; line-height: 20px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf c5_005">
    <div class="wf__inner c5_005__wrap">
      <div class="c5_005__head">
        <p class="e en">DUMMY TEXT</p>
        <h2>ダミーテキスト見出し</h2>
      </div>
      <div class="c5_005__list">
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
        <div class="c5_005__c"><div class="ph img" data-l=""></div><p class="tt">ダミーテキストの<br>項目名</p><p>ダミーテキスト</p></div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
