<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col5-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   5カラム以上 / よくある質問を横に5枚並べるカード
   参考サイトのHTMLをDOM実測（1440幅・カード幅213・ピッチ301 → 1296幅に合わせ240/gap24）
   英字ラベル 12px＋和文32px/700（中央）／ リード 16px/500（幅480・中央）
   質問 18px/700 lh1.6 ／ 下に開閉アイコン
   ============================================================ */
.col5_003 { background: var(--c-white); }
.col5_003__head { position: absolute; left: 0; top: 189px; width: 1440px; text-align: center; }
.col5_003__en { font-size: 12px; line-height: 1; letter-spacing: .06em; color: var(--c-mute); }
.col5_003__ttl { margin-top: 20px; font-size: 32px; font-weight: 700; line-height: 44px; }
.col5_003__lead { margin: 30px auto 0; width: 480px; font-size: 16px; font-weight: 500; line-height: 1.9; color: var(--c-sub); }

.col5_003__cards { position: absolute; left: var(--wf-pad); top: 431px; width: var(--wf-content); display: flex; gap: 24px; }
.col5_003__card {
  width: 240px; height: 180px; padding: 26px 22px;
  background: var(--c-bg-gray);
  display: flex; flex-direction: column; justify-content: space-between;
}
.col5_003__card p { font-size: 18px; font-weight: 700; line-height: 1.6; }
.col5_003__card .ic {
  width: 28px; height: 28px; border-radius: 50%; background: var(--c-white);
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--c-sub);
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf col5_003">
    <div class="col5_003__head">
      <p class="col5_003__en en">Dummy</p>
      <h2 class="col5_003__ttl">よくあるご質問</h2>
      <p class="col5_003__lead">ダミーテキスト・ダミーテキストのために。ダミーテキストダミーテキストをまとめました。</p>
    </div>

    <div class="col5_003__cards">
      <div class="col5_003__card"><p>ダミーテキストひとつでもダミーテキストしていいですか？</p><span class="ic"><i class="fa-solid fa-plus"></i></span></div>
      <div class="col5_003__card"><p>ダミーテキスト中、ダミーテキストできますか？</p><span class="ic"><i class="fa-solid fa-plus"></i></span></div>
      <div class="col5_003__card"><p>ダミーテキストの際、ダミーテキストはどうなりますか？</p><span class="ic"><i class="fa-solid fa-plus"></i></span></div>
      <div class="col5_003__card"><p>ダミーテキストやダミーテキストにお金はかかりますか？</p><span class="ic"><i class="fa-solid fa-plus"></i></span></div>
      <div class="col5_003__card"><p>他社でダミーテキスト中ですが、ダミーテキストだけでも可能ですか？</p><span class="ic"><i class="fa-solid fa-plus"></i></span></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
