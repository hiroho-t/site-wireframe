<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col4-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 DATA / 数字で見る。定番の4カラム均等グリッド
   見出し 英字ラベル14px＋和文40px＋リード16px
   数字カード 幅300・gap32（4列で1296）。ラベル16px＋数字60px＋単位20px＋注記13px
   縦罫線で4つを等分に区切る
   ============================================================ */
.col4_004 { background: var(--c-bg-gray); }
.col4_004__head { top: 193px; }
.col4_004__en { font-size: 14px; font-weight: 700; line-height: 1; color: var(--c-mute); letter-spacing: .06em; }
.col4_004__ttl { margin-top: 20px; font-size: 40px; font-weight: 700; line-height: 1.3; }
.col4_004__lead { margin-top: 24px; font-size: 16px; line-height: 30px; color: var(--c-sub); }

.col4_004__grid { position: absolute; left: var(--wf-pad); top: 467px; width: var(--wf-content); display: flex; }
.col4_004__b { width: 324px; padding: 0 24px; border-left: 1px solid var(--c-line); }
.col4_004__b:last-child { border-right: 1px solid var(--c-line); }
.col4_004__b h3 { font-size: 16px; font-weight: 700; line-height: 1; }
.col4_004__num { margin-top: 26px; display: flex; align-items: baseline; gap: 8px; }
.col4_004__num .n { font-size: 60px; font-weight: 700; line-height: 1; }
.col4_004__num .u { font-size: 20px; font-weight: 500; line-height: 1; }
.col4_004__note { margin-top: 16px; font-size: 13px; line-height: 1.6; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col4_004">
    <div class="wf__inner col4_004__head">
      <p class="col4_004__en en">Dummy Text</p>
      <h2 class="col4_004__ttl">数字で見るダミーテキスト</h2>
      <p class="col4_004__lead">ダミーテキストダミーテキストを、数字を通してご紹介します。</p>
    </div>

    <div class="col4_004__grid">
      <div class="col4_004__b">
        <h3>ダミー項目名</h3>
        <p class="col4_004__num"><span class="n en">000</span><span class="u">名</span></p>
        <p class="col4_004__note">※ ダミーテキスト含む</p>
      </div>
      <div class="col4_004__b">
        <h3>ダミー項目</h3>
        <p class="col4_004__num"><span class="n en">0000</span><span class="u">店舗</span></p>
        <p class="col4_004__note">※ 20XX年00月現在</p>
      </div>
      <div class="col4_004__b">
        <h3>ダミー項目名称</h3>
        <p class="col4_004__num"><span class="n en">00.0</span><span class="u">歳</span></p>
        <p class="col4_004__note">※ ダミーテキスト</p>
      </div>
      <div class="col4_004__b">
        <h3>ダミー項目名</h3>
        <p class="col4_004__num"><span class="n en">00.0</span><span class="u">%</span></p>
        <p class="col4_004__note">※ ダミーテキスト</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
