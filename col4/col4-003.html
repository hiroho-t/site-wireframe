<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col4-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   05 COMPANY / 英字130pxの見出し＋幅いっぱいのリード。下にカード4枚（上揃え）
   URLからDOM実測（1440幅・元セクション高1162 → 800に収めるためカードを352→250に）
   英字 130px/100 ＋ 和文 20px/300 ／ リード 16px/400 lh33.6（幅1210）
   カード 288幅：画像288×250＋番号15px/300＋英字22px/600＋和文15px/600、段差30
   ============================================================ */
.col4_003 { background: var(--c-bg-gray); }
.col4_003__head { position: absolute; left: 115px; top: 46px; display: flex; align-items: flex-end; gap: 8px; }
.col4_003__en { font-size: 130px; font-weight: 100; line-height: 130px; letter-spacing: .01em; }
.col4_003__jp { padding-bottom: 20px; font-size: 20px; font-weight: 300; line-height: 20px; }
.col4_003__lead { position: absolute; left: 115px; top: 237px; width: 1210px; font-size: 16px; line-height: 33.6px; color: var(--c-sub); }

.col4_003__cards { position: absolute; left: 115px; top: 392px; }
.col4_003__c { position: absolute; width: 288px; }
.col4_003__c .ph { position: relative; width: 288px; height: 250px; }
.col4_003__c .no { position: absolute; left: 49px; top: 46px; font-size: 15px; font-weight: 300; line-height: 24px; color: var(--c-white); }
.col4_003__c .e { margin-top: 26px; padding-left: 30px; font-size: 22px; font-weight: 600; line-height: 33px; }
.col4_003__c .j { padding-left: 30px; font-size: 15px; font-weight: 600; line-height: 22.5px; color: var(--c-sub); }
.col4_003__c1 { left: 0; top: 0; }
.col4_003__c2 { left: 308px; top: 0; }
.col4_003__c3 { left: 615px; top: 0; }
.col4_003__c4 { left: 922px; top: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col4_003">
    <div class="col4_003__head">
      <span class="col4_003__en en">Dummy</span>
      <span class="col4_003__jp">ダミー項目名</span>
    </div>
    <p class="col4_003__lead">ダミーテキストからまもなくダミーテキストを迎えるダミーテキスト。ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストしてきました。</p>

    <div class="col4_003__cards">
      <div class="col4_003__c col4_003__c1"><div class="ph img img--dark" data-l="IMAGE"><span class="no en">01</span></div>
        <p class="e en">Dummy</p><p class="j">ダミー項目名</p></div>
      <div class="col4_003__c col4_003__c2"><div class="ph img img--dark" data-l="IMAGE"><span class="no en">02</span></div>
        <p class="e en">Dummy</p><p class="j">ダミー項目名</p></div>
      <div class="col4_003__c col4_003__c3"><div class="ph img img--dark" data-l="IMAGE"><span class="no en">03</span></div>
        <p class="e en">Dummy Text</p><p class="j">ダミー項目</p></div>
      <div class="col4_003__c col4_003__c4"><div class="ph img img--dark" data-l="IMAGE"><span class="no en">04</span></div>
        <p class="e en">Dummy</p><p class="j">ダミー項目名</p></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
