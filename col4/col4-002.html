<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col4-002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 COMPANY / 左に英字大見出し（2行）、右に4カラムのカード
   実測（1440基準）見出し 44px/900 lh1.15
   カード 幅246・gap28。画像 246×166、その下に見出し14px、右下に丸ボタンφ26
   ============================================================ */
.col4_002 { background: var(--c-white); }
.col4_002__row { position: absolute; left: var(--wf-pad); top: 277px; width: var(--wf-content); display: flex; align-items: flex-start; gap: 60px; }
.col4_002__ttl { width: 250px; flex-shrink: 0; font-size: 44px; font-weight: 900; line-height: 1.15; letter-spacing: .01em; }
.col4_002__cards { display: flex; gap: 28px; }
.col4_002__card { width: 246px; background: var(--c-bg-gray); padding-bottom: 16px; position: relative; }
.col4_002__card .ph { width: 100%; height: 166px; }
.col4_002__card .tx { padding: 20px 18px 0; font-size: 14px; font-weight: 700; line-height: 1.6; }
.col4_002__card .cir {
  position: absolute; right: 16px; bottom: 14px;
  width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--c-sub);
  background: var(--c-white);
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf col4_002">
    <div class="col4_002__row">
      <h2 class="col4_002__ttl en">DUMMY<br>TEXT.</h2>
      <div class="col4_002__cards">
        <div class="col4_002__card"><div class="ph img" data-l="IMAGE"></div><p class="tx">ダミー項目について<br>ダミー項目名</p><span class="cir"><i class="fa-solid fa-play"></i></span></div>
        <div class="col4_002__card"><div class="ph img" data-l="IMAGE"></div><p class="tx">ダミー項目名称</p><span class="cir"><i class="fa-solid fa-play"></i></span></div>
        <div class="col4_002__card"><div class="ph img" data-l="IMAGE"></div><p class="tx">ダミー項目名</p><span class="cir"><i class="fa-solid fa-play"></i></span></div>
        <div class="col4_002__card"><div class="ph img" data-l="IMAGE"></div><p class="tx">ダミー・ダミー項目</p><span class="cir"><i class="fa-solid fa-play"></i></span></div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
