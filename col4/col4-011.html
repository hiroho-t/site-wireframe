<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col4-011</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   04 INDEX / 縦書きの小見出し＋リンク行リストを4カラム
   各カラム＝左に縦書き見出し24px（幅34）／右に罫線区切りのリンク4行（20px＋矢印）
   和文サイトのカテゴリ案内向け。上下中央（top 221px）
   ============================================================ */
.c4_011 { background: var(--c-white); }
.c4_011__wrap { top: 221px; }
.c4_011__head .e { font-size: 15px; font-weight: 400; line-height: 22px; letter-spacing: .1em; color: var(--c-mute); }
.c4_011__head h2 { margin-top: 10px; font-size: 26px; font-weight: 700; line-height: 38px; letter-spacing: .06em; }
.c4_011__list { display: flex; gap: 32px; margin-top: 56px; }
.c4_011__col { width: 300px; display: flex; gap: 20px; }
.c4_011__ttl { width: 34px; flex: none; writing-mode: vertical-rl; font-size: 24px; font-weight: 700;
  letter-spacing: .1em; line-height: 34px; }
.c4_011__links { flex: 1; }
.c4_011__links li { border-top: 1px solid var(--c-line); }
.c4_011__links li:last-child { border-bottom: 1px solid var(--c-line); }
.c4_011__links a { display: flex; align-items: center; justify-content: space-between; height: 56px; font-size: 20px; font-weight: 500; }
.c4_011__links i { font-size: 11px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf c4_011">
    <div class="wf__inner c4_011__wrap">
      <div class="c4_011__head">
        <p class="e en">DUMMY TEXT</p>
        <h2>ダミーテキスト見出し</h2>
      </div>
      <div class="c4_011__list">
        <div class="c4_011__col">
          <p class="c4_011__ttl">ダミー項目</p>
          <ul class="c4_011__links">
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
          </ul>
        </div>
        <div class="c4_011__col">
          <p class="c4_011__ttl">ダミー項目</p>
          <ul class="c4_011__links">
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
          </ul>
        </div>
        <div class="c4_011__col">
          <p class="c4_011__ttl">ダミー項目</p>
          <ul class="c4_011__links">
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
          </ul>
        </div>
        <div class="c4_011__col">
          <p class="c4_011__ttl">ダミー項目</p>
          <ul class="c4_011__links">
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目名<i class="fa-solid fa-arrow-right"></i></a></li>
            <li><a href="#">ダミー項目<i class="fa-solid fa-arrow-right"></i></a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
