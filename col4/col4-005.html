<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col4-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 PRODUCT / ラベル＋英字大見出し＋Prev/Next＋ピルボタン、下に商品カードの横並び
   実測（1440基準）英字見出し 62px ／ カード 299×206（画像）＋名称2行、gap 28
   スライダーは動かさず中央に静止させた状態で見せる
   ============================================================ */
.col4_005 { background: var(--c-white); }
.col4_005__head { top: 145px; display: flex; align-items: flex-end; }
.col4_005__lab { font-size: 15px; font-weight: 500; color: var(--c-sub); }
.col4_005__ttl { margin-top: 20px; font-size: 62px; font-weight: 400; line-height: 1; letter-spacing: .04em; color: var(--c-mute); }
.col4_005__ctrl { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 15px; font-weight: 500; color: var(--c-sub); }
.col4_005__ctrl .ln { width: 1px; height: 18px; background: var(--c-line); }
.col4_005__ctrl .btn-black { width: 190px; height: 50px; font-size: 14px; font-weight: 700; gap: 12px; margin-left: 18px; }
.col4_005__ctrl .btn-black i { font-size: 7px; }

.col4_005__slider { position: absolute; left: var(--wf-pad); top: 373px; width: var(--wf-content); display: flex; gap: 28px; }
.col4_005__card { width: 303px; flex-shrink: 0; }
.col4_005__card .ph { width: 100%; height: 206px; border-radius: 6px; }
.col4_005__card .nm { margin-top: 22px; font-size: 15px; line-height: 1.7; }
.col4_005__card .nm::before { content: "—"; display: block; color: var(--c-light); margin-bottom: 4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col4_005">
    <div class="wf__inner col4_005__head">
      <div>
        <p class="col4_005__lab">ダミーの分類名</p>
        <h2 class="col4_005__ttl en">DUMMY TEXT</h2>
      </div>
      <div class="col4_005__ctrl">
        <span class="en"><i class="fa-solid fa-arrow-left"></i> Prev</span>
        <span class="ln"></span>
        <span class="en">Next <i class="fa-solid fa-arrow-right"></i></span>
        <span class="btn-black en">VIEW MORE <i class="fa-solid fa-circle"></i></span>
      </div>
    </div>
    <div class="col4_005__slider">
      <div class="col4_005__card"><div class="ph img" data-l="ITEM"></div><p class="nm">ダミー商品名テキスト</p></div>
      <div class="col4_005__card"><div class="ph img" data-l="ITEM"></div><p class="nm">ダミー商品名（ダミーテキストダミー）</p></div>
      <div class="col4_005__card"><div class="ph img" data-l="ITEM"></div><p class="nm">ダミー商品名（ダミー）</p></div>
      <div class="col4_005__card"><div class="ph img" data-l="ITEM"></div><p class="nm">ダミー商品名</p></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
