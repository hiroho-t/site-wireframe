<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-008</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 MAGAZINE / 見出し＋記事カードの横並び（スライダーを中央静止で表示）
   URLからDOM実測（1440幅・セクション高825を800に収める）
   見出し 英字14/500 → 和文28/600 lh42 → 本文14/400
   カード 幅383。画像383×215 ／ タグ13/500（高さ28）＋日付12/500 ／ 見出し18/600 lh28.8
   ============================================================ */
.col3_008 { background: var(--c-white); }
.col3_008__head { top: 149px; }
.col3_008__en { font-size: 14px; font-weight: 500; line-height: 14px; }
.col3_008__ttl { margin-top: 11px; font-size: 28px; font-weight: 600; line-height: 42px; }
.col3_008__lead { margin-top: 23px; font-size: 14px; line-height: 22.4px; color: var(--c-sub); }

.col3_008__cards { position: absolute; left: var(--wf-pad); top: 324px; display: flex; gap: 73.5px; }
.col3_008__card { width: 383px; }
.col3_008__card .ph { width: 383px; height: 215px; }
.col3_008__card .meta { margin-top: 19px; display: flex; align-items: center; gap: 12px; }
.col3_008__card .tg {
  height: 28px; padding: 0 14px; border-radius: 14px; background: var(--c-bg-gray);
  display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--c-sub);
}
.col3_008__card .dt { font-size: 12px; font-weight: 500; line-height: 18px; color: var(--c-mute); }
.col3_008__card h3 { margin-top: 11px; font-size: 18px; font-weight: 600; line-height: 28.8px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_008">
    <div class="wf__inner col3_008__head">
      <p class="col3_008__en en">Dummy</p>
      <p class="col3_008__ttl">ダミーテキストの取り組み</p>
      <p class="col3_008__lead">ダミーテキストが今、ダミーテキストを当てて取り組んでいることをご紹介します。</p>
    </div>
    <div class="col3_008__cards">
      <div class="col3_008__card">
        <div class="ph img" data-l="THUMB"></div>
        <div class="meta"><span class="tg">ダミー</span><span class="dt en">2026.08.07</span></div>
        <h3>ダミーテキストダミー「ダミーテキスト」をダミーする出張ダミー〜</h3>
      </div>
      <div class="col3_008__card">
        <div class="ph img" data-l="THUMB"></div>
        <div class="meta"><span class="tg">ダミー名</span><span class="dt en">2026.08.05</span></div>
        <h3>ダミーテキストダミー「ダミーテキスト」をダミーする出張ダミー〜</h3>
      </div>
      <div class="col3_008__card">
        <div class="ph img" data-l="THUMB"></div>
        <div class="meta"><span class="tg">ダミー</span><span class="dt en">2026.08.04</span></div>
        <h3>〜ダミーテキストとダミーテキストが同じダミーでつないだ、“ダミー</h3>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
