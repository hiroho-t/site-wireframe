<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 MAGAZINE / 英字見出し＋リンク、下に3カラムの記事グリッド（2行）
   実測（1440基準）見出し 40px/900 ／ パネルはグレー面、セルは1px罫線で区切る
   セル 幅432：画像 336×186 ＋ タイトル14px lh1.8 ＋ 右下に日付12px
   ============================================================ */
.col3_007 { background: var(--c-white); }
.col3_007__panel { position: absolute; left: var(--wf-pad); top: 170px; width: var(--wf-content); background: var(--c-bg-gray); padding: 44px 0 0; }
.col3_007__hd { display: flex; align-items: center; gap: 26px; padding: 0 44px 34px; }
.col3_007__hd h2 { font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: .02em; }
.col3_007__hd .lk { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; }
.col3_007__hd .cir {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--c-sub);
}
.col3_007__grid { display: flex; flex-wrap: wrap; border-top: 1px solid var(--c-line); }
.col3_007__cell { width: 432px; padding: 30px 34px 26px; border-right: 1px solid var(--c-line); border-bottom: 1px solid var(--c-line); }
.col3_007__cell:nth-child(3n) { border-right: 0; }
.col3_007__cell .ph { width: 336px; height: 186px; }
.col3_007__cell h3 { margin-top: 18px; font-size: 14px; line-height: 1.8; }
.col3_007__cell .dt { display: block; margin-top: 12px; text-align: right; font-size: 12px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_007">
    <div class="col3_007__panel">
      <div class="col3_007__hd">
        <h2 class="en">DUMMY</h2>
        <span class="lk">ダミーリンク <span class="cir"><i class="fa-solid fa-play"></i></span></span>
      </div>
      <div class="col3_007__grid">
        <div class="col3_007__cell"><div class="ph img" data-l="THUMB"></div><h3>ダミーテキストダミーテキストダミーテキスト。ダミーテキストダミーテキスト【ダミーテキスト #00】</h3><span class="dt en">2026.08.03</span></div>
        <div class="col3_007__cell"><div class="ph img" data-l="THUMB"></div><h3>ダミーテキストダミー、ダミーテキストダミーテキスト。ダミーテキストダミーテキストダミーの物語。</h3><span class="dt en">2026.07.16</span></div>
        <div class="col3_007__cell"><div class="ph img" data-l="THUMB"></div><h3>ダミーテキストダミーテキストダミーテキストダミー！ダミーテキストダミーテキストダミー</h3><span class="dt en">2026.05.29</span></div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
