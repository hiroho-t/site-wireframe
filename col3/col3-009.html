<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-009</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   03 MAGAZINE / 中央見出し＋リード。下に3カラムの記事カード
   URLからDOM実測（1440幅・元セクション高1083 → 800に収める）
   ラベル 20px/700 ／ 見出し 48px/700 lh84 ／ リード 16px/400 lh36.8
   カード 幅380：画像380×244 ＋ 日付12px/700 ＋ 見出し16px/700 lh27.2 ＋ 本文16px/400 lh27.2
   ============================================================ */
.col3_009 { background: var(--c-white); }
.col3_009__head { position: absolute; left: 0; top: 57px; width: 1440px; text-align: center; }
.col3_009__en { font-size: 20px; font-weight: 700; line-height: 20px; }
.col3_009__ttl { margin-top: 8px; font-size: 48px; font-weight: 700; line-height: 84px; }
.col3_009__lead { margin-top: 8px; font-size: 16px; line-height: 36.8px; color: var(--c-sub); }

.col3_009__cards { position: absolute; left: 123px; top: 307px; display: flex; gap: 27px; }
.col3_009__card { width: 380px; }
.col3_009__card .ph { width: 380px; height: 244px; }
.col3_009__card .dt { margin-top: 16px; padding: 0 32px; font-size: 12px; font-weight: 700; line-height: 21.6px; color: var(--c-mute); }
.col3_009__card h3 { margin-top: 8px; padding: 0 32px; font-size: 16px; font-weight: 700; line-height: 27.2px; }
.col3_009__card p { margin-top: 16px; padding: 0 32px; font-size: 16px; line-height: 27.2px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_009">
    <div class="col3_009__head">
      <p class="col3_009__en en">Dummy</p>
      <h2 class="col3_009__ttl">ダミー項目</h2>
      <p class="col3_009__lead">ダミーテキストのダミーテキストやさまざまなダミーテキストをご紹介します。</p>
    </div>

    <div class="col3_009__cards">
      <div class="col3_009__card">
        <div class="ph img" data-l="THUMB"></div>
        <p class="dt en">2026.4.23</p>
        <h3>“ダミー”のダミーテキストを超えてダミーテキストに向き合う。</h3>
        <p>ダミーテキストなダミーテキストをダミーテキストし、ダミーテキストをダミーテキスト</p>
      </div>
      <div class="col3_009__card">
        <div class="ph img" data-l="THUMB"></div>
        <p class="dt en">2026.3.10</p>
        <h3>ダミーテキストのダミーテキストをダミーテキストの力に。</h3>
        <p>ダミーテキストからダミーテキストのダミーテキストまで、ダミーテキストな</p>
      </div>
      <div class="col3_009__card">
        <div class="ph img" data-l="THUMB"></div>
        <p class="dt en">2026.2.14</p>
        <h3>ダミーテキストダミーテキストのダミーテキストをつくる。</h3>
        <p>ダミーテキストダミーテキストダミーテキストのダミーテキストについて</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
