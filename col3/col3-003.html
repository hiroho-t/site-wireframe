<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 INTERVIEW / 見出し＋3カラムのインタビューカード
   URLからDOM実測（1440幅・元セクション高1072 → 800に収めるため見出しの余白を詰める）
   見出し 英字14/500 → 和文28/600 lh42 → 本文14/400
   カード 幅383・ピッチ439。画像383×383（左上にタグ89×31）／ 部署14/500 lh20.25
          見出し18/600 lh27 ／ 氏名16/400 lh24
   ============================================================ */
.col3_003 { background: var(--c-white); }
.col3_003__head { top: 70px; }
.col3_003__en { font-size: 14px; font-weight: 500; line-height: 14px; }
.col3_003__ttl { margin-top: 11px; font-size: 28px; font-weight: 600; line-height: 42px; }
.col3_003__lead { margin-top: 22px; font-size: 14px; line-height: 22.4px; color: var(--c-sub); }

.col3_003__cards { position: absolute; left: var(--wf-pad); top: 250px; display: flex; gap: 56px; }
.col3_003__card { width: 383px; }
.col3_003__card .ph { position: relative; width: 383px; height: 383px; }
.col3_003__card .tag {
  position: absolute; left: 14px; top: 14px;
  width: 89px; height: 31px; border-radius: 16px;
  background: var(--c-white); color: var(--c-text);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 500;
}
.col3_003__card .dep { position: absolute; left: 14px; bottom: 14px; width: 300px; font-size: 14px; font-weight: 500; line-height: 20.25px; color: var(--c-white); }
.col3_003__card h3 { margin-top: 22px; font-size: 18px; font-weight: 600; line-height: 27px; }
.col3_003__card .nm { margin-top: 10px; font-size: 16px; line-height: 24px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_003">
    <div class="wf__inner col3_003__head">
      <p class="col3_003__en en">Dummy</p>
      <p class="col3_003__ttl">ダミーテキストダミー</p>
      <p class="col3_003__lead">ダミーテキストダミーテキストの言葉から、ダミーテキストで働くダミーテキストをご紹介します。</p>
    </div>
    <div class="col3_003__cards">
      <div class="col3_003__card">
        <div class="ph img img--dark" data-l="PORTRAIT"><span class="tag">ダミー</span><span class="dep">ダミー本部 第1ダミー部 ダミーグループ</span></div>
        <h3>ダミーテキストダミーテキストダミーテキストダミー</h3>
        <p class="nm">D.Dさん</p>
      </div>
      <div class="col3_003__card">
        <div class="ph img img--dark" data-l="PORTRAIT"><span class="tag">ダミー</span><span class="dep">ダミー部 第1グループ</span></div>
        <h3>ダミーテキストダミーテキスト、ダミーテキストダミーテキストダミー</h3>
        <p class="nm">D.Dさん</p>
      </div>
      <div class="col3_003__card">
        <div class="ph img img--dark" data-l="PORTRAIT"><span class="tag">ダミー</span><span class="dep">ダミー部 ダミーグループ</span></div>
        <h3>ダミーテキストダミーテキストダミーテキストを、</h3>
        <p class="nm">D.Dさん</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
