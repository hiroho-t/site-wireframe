<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 FEATURE / 特長・強みを3カラムのカードで並べる定番型
   見出し 英字ラベル14px＋和文40px、リード16px
   カード 幅400・gap48（3列で1296）。画像400×260＋番号＋見出し20px＋本文15px lh30
   ============================================================ */
.col3_001 { background: var(--c-white); }
.col3_001__head { top: 80px; }
.col3_001__en { font-size: 14px; font-weight: 700; line-height: 1; color: var(--c-mute); letter-spacing: .06em; }
.col3_001__ttl { margin-top: 20px; font-size: 40px; font-weight: 700; line-height: 1.3; }
.col3_001__lead { margin-top: 24px; font-size: 16px; line-height: 30px; color: var(--c-sub); }

.col3_001__cards { position: absolute; left: var(--wf-pad); top: 304px; width: var(--wf-content); display: flex; gap: 48px; }
.col3_001__card { width: 400px; }
.col3_001__card .ph { width: 400px; height: 260px; }
.col3_001__card .no { margin-top: 26px; font-size: 14px; font-weight: 700; line-height: 1; color: var(--c-light); }
.col3_001__card h3 { margin-top: 14px; font-size: 20px; font-weight: 700; line-height: 1.6; }
.col3_001__card p { margin-top: 16px; font-size: 15px; line-height: 30px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_001">
    <div class="wf__inner col3_001__head">
      <p class="col3_001__en en">Dummy</p>
      <h2 class="col3_001__ttl">ダミーテキストの特長</h2>
      <p class="col3_001__lead">ダミーテキストダミーテキストダミーテキストダミーテキストをご紹介します。</p>
    </div>

    <div class="col3_001__cards">
      <div class="col3_001__card">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="no en">01</p>
        <h3>ダミーテキストダミー</h3>
        <p>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
      </div>
      <div class="col3_001__card">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="no en">02</p>
        <h3>ダミーテキストダミーテキスト</h3>
        <p>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
      </div>
      <div class="col3_001__card">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="no en">03</p>
        <h3>ダミーテキスト</h3>
        <p>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
