<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 CASE / 縦長カード3枚の実績一覧
   URLからDOM実測（1440幅）英字 56px/400 ＋ 和文 16px/600
   カード 290×435（画像）＋ 番号12px＋地域12px/600＋日付12px/600 を画像上に重ね
   タイトル 18px/600 lh27（幅242）＋ 英字 11px/400
   ============================================================ */
.col3_006 { background: var(--c-white); }
.col3_006__head { position: absolute; left: 80px; top: 116px; display: flex; align-items: baseline; }
.col3_006__en { font-size: 56px; font-weight: 400; line-height: 56px; letter-spacing: .01em; }
.col3_006__jp { margin-left: 14px; font-size: 16px; font-weight: 600; line-height: 25.6px; }

.col3_006__cards { position: absolute; left: 410px; top: 244px; display: flex; gap: 40px; }
.col3_006__card { position: relative; width: 290px; }
.col3_006__card .ph { width: 290px; height: 435px; }
.col3_006__card .meta {
  position: absolute; left: 24px; top: 24px; display: flex; gap: 8px;
  font-size: 12px; line-height: 19.2px; color: var(--c-white);
}
.col3_006__card .meta b { font-weight: 600; }
.col3_006__card .tt { position: absolute; left: 24px; bottom: 60px; width: 242px; font-size: 18px; font-weight: 600; line-height: 27px; color: var(--c-white); }
.col3_006__card .e { position: absolute; left: 24px; bottom: 24px; width: 242px; font-size: 11px; line-height: 13.2px; color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_006">
    <div class="col3_006__head">
      <span class="col3_006__en en">Dummy</span>
      <span class="col3_006__jp">ダミー項目</span>
    </div>

    <div class="col3_006__cards">
      <div class="col3_006__card">
        <div class="ph img img--dark" data-l="IMAGE"></div>
        <p class="meta"><span class="en">01</span><b>ダミー県</b><b class="en">2025.10.31 設置</b></p>
        <p class="tt">No0-ダミー県ダミー市ダミーテキスト</p>
        <p class="e en">Dummy text of the project</p>
      </div>
      <div class="col3_006__card">
        <div class="ph img img--dark" data-l="IMAGE"></div>
        <p class="meta"><span class="en">02</span><b>ダミー県</b><b class="en">2025.09.26 設置</b></p>
        <p class="tt">No0-ダミー県ダミー市ダミーテキスト</p>
        <p class="e en">Dummy text of the project</p>
      </div>
      <div class="col3_006__card">
        <div class="ph img img--dark" data-l="IMAGE"></div>
        <p class="meta"><span class="en">03</span><b>ダミー県</b><b class="en">2025.08.19 設置</b></p>
        <p class="tt">No0-ダミー県ダミー市ダミーテキスト</p>
        <p class="e en">Dummy text of the project</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
