<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-012</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   02 GALLERY / 左に英字90pxの見出し＋View All、右に正方形の画像グリッド
   URLからDOM実測（1440幅）。元は370角の画像が縦に流れるスライダー →
   ルールに従い 3列×2行の静止グリッドに正規化した
   英字 90px/500 lh99 ／ 和文 14px/500 ／ セル 240×240（gap20）
   ============================================================ */
.col3_012 { background: var(--c-white); }
.col3_012__head { position: absolute; left: 50px; top: 240px; }
.col3_012__en { font-size: 90px; font-weight: 500; line-height: 99px; letter-spacing: .01em; }
.col3_012__jp { font-size: 14px; font-weight: 500; line-height: 19.6px; color: var(--c-sub); }
.col3_012__all {
  margin-top: 40px; height: 52px; width: 180px; border-radius: 26px; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 16px; font-weight: 500;
}
.col3_012__grid { position: absolute; left: 610px; top: 140px; width: 780px; display: flex; flex-wrap: wrap; gap: 20px; }
.col3_012__grid .ph { width: 246px; height: 246px; border-radius: 8px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_012">
    <div class="col3_012__head">
      <p class="col3_012__en en">Dummy</p>
      <p class="col3_012__jp">ダミー項目</p>
      <div class="col3_012__all"><span class="en">View All</span> <i class="fa-solid fa-arrow-right"></i></div>
    </div>
    <div class="col3_012__grid">
      <div class="ph img"></div><div class="ph img"></div><div class="ph img"></div>
      <div class="ph img"></div><div class="ph img"></div><div class="ph img"></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
