<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-017</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   3カラム / 業種ラベル＋見出し＋2行のクレジットを持つ事例カード
   参考サイトのHTMLをDOM実測（1440幅・カードピッチ469 → 1296幅に合わせ432/gap60）
   画像 372×209 ／ 業種 13px ／ 見出し 16px lh1.7（4行まで）
   クレジット 13px×2行 ／ 右下に丸矢印
   ============================================================ */
.col3_017 { background: var(--c-white); }
.col3_017__ttl { position: absolute; left: 0; top: 143px; width: 1440px; text-align: center; font-size: 32px; font-weight: 700; line-height: 44px; }

.col3_017__cards { position: absolute; left: var(--wf-pad); top: 247px; width: var(--wf-content); display: flex; gap: 60px; }
.col3_017__card { position: relative; width: 392px; }
.col3_017__card .ph { width: 392px; height: 220px; }
.col3_017__card .cat { margin-top: 33px; font-size: 13px; line-height: 24px; color: var(--c-mute); }
.col3_017__card h3 { margin-top: 6px; font-size: 16px; line-height: 1.7; }
.col3_017__card .cr { margin-top: 24px; font-size: 13px; line-height: 21px; color: var(--c-sub); }
.col3_017__card .cir {
  position: absolute; right: 0; bottom: 0;
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--c-sub);
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_017">
    <h2 class="col3_017__ttl">ダミーテキストの実績</h2>

    <div class="col3_017__cards">
      <div class="col3_017__card">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="cat">ダミー・ダミーテキスト</p>
        <h3>年間0000万円以上のダミーテキストを実現。ダミーテキストダミーテキストの見直し</h3>
        <p class="cr">ダミー株式会社<br>ダミーテキスト ダミーサービス名</p>
        <span class="cir"><i class="fa-solid fa-arrow-right"></i></span>
      </div>
      <div class="col3_017__card">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="cat">ダミー・ダミー</p>
        <h3>「そこまで任せていいんですか？」ダミーテキストダミーテキストの進め方</h3>
        <p class="cr">ダミー株式会社<br>ダミーテキスト ダミーサービス名</p>
        <span class="cir"><i class="fa-solid fa-arrow-right"></i></span>
      </div>
      <div class="col3_017__card">
        <div class="ph img" data-l="IMAGE"></div>
        <p class="cat">ダミーテキスト</p>
        <h3>ダミーテキストダミーテキストをダミーテキストからつくり直した話</h3>
        <p class="cr">ダミー株式会社<br>ダミーテキスト ダミーサービス名</p>
        <span class="cir"><i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
