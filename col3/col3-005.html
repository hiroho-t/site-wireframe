<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   01 CASE / コンパクトな見出し＋段違い3カラムのカード
   カード サムネ（枠幅・比率16:11）＋ タグ ＋ タイトル18px/700 ＋ 社名／日付
   3枚は開始位置を揃える（段違いにしない）
   ============================================================ */
.col3_005 { background: var(--c-white); }
.col3_005__wrap { top: 146px; }
.col3_005__sh { display: flex; align-items: baseline; gap: 24px; }
.col3_005__sh .e { font-size: 48px; font-weight: 700; line-height: 1.2; }
.col3_005__sh .j { font-size: 14px; font-weight: 700; line-height: 1.5; letter-spacing: .03em; color: var(--c-mute); }

.col3_005__list { display: flex; flex-wrap: wrap; gap: 0 62px; align-items: flex-start; margin-top: 40px; }
.col3_005__list li { width: calc(33.33% - 41.33px); }
.col3_005__ph { width: 100%; aspect-ratio: 16/11; border-radius: 10px; }
.col3_005__tags { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.col3_005__tags span {
  font-size: 11px; font-weight: 600; line-height: 1.6;
  border: 1px solid var(--c-line); padding: 1px 9px; color: var(--c-mute);
}
.col3_005__list h3 { font-size: 18px; font-weight: 700; line-height: 1.65; margin-top: 10px; }
.col3_005__meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 12px; }
.col3_005__meta .co { font-size: 11px; font-weight: 600; line-height: 1.6; }
.col3_005__meta .dt { font-size: 12px; font-weight: 500; line-height: 1; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_005">

    <div class="wf__inner col3_005__wrap">
      <div class="col3_005__sh">
        <p class="e en">DUMMY TEXT</p>
        <p class="j">ダミー見出し</p>
      </div>

      <ul class="col3_005__list">
        <li>
          <div class="col3_005__ph img" data-l="THUMB"></div>
          <div class="col3_005__tags"><span>ダミータグ</span><span>ダミー</span></div>
          <h3>ダミーテキストダミーテキスト──ダミーテキストダミーテキスト</h3>
          <div class="col3_005__meta"><span class="co">ダミー株式会社</span><span class="dt en">2026.05.14</span></div>
        </li>
        <li>
          <div class="col3_005__ph img" data-l="THUMB"></div>
          <div class="col3_005__tags"><span>ダミータグ名</span><span>ダミー</span></div>
          <h3>ダミーテキストダミーテキストダミー──ダミーテキスト</h3>
          <div class="col3_005__meta"><span class="co">ダミー株式会社</span><span class="dt en">2026.03.30</span></div>
        </li>
        <li>
          <div class="col3_005__ph img" data-l="THUMB"></div>
          <div class="col3_005__tags"><span>ダミータグ</span><span>ダミー名</span></div>
          <h3>ダミーテキストダミーテキスト、ダミーテキストダミー</h3>
          <div class="col3_005__meta"><span class="co">ダミー株式会社</span><span class="dt en">2026.01.22</span></div>
        </li>
      </ul>
    </div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
