<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   03 DOWNLOAD / 資料ダウンロードのカード3枚
   カード＝表紙画像400×260（枠線）＋タイトル18px＋本文14px＋DLボタン
   ホワイトペーパー・パンフレット配布に
   上下中央（top 131px）
   ============================================================ */
.c3_024 { background: var(--c-white); }
.c3_024__wrap { top: 131px; }
.c3_024__head { text-align: center; }
.c3_024__head .e { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: .12em; color: var(--c-mute); }
.c3_024__head h2 { margin-top: 10px; font-size: 30px; font-weight: 700; line-height: 44px; letter-spacing: .05em; }
.c3_024__list { display: flex; gap: 48px; margin-top: 48px; }
.c3_024__c { width: 400px; }
.c3_024__c .ph { width: 400px; height: 240px; border: 1px solid var(--c-line); }
.c3_024__c h3 { margin-top: 20px; font-size: 18px; font-weight: 700; line-height: 27px; }
.c3_024__c p { margin-top: 10px; font-size: 14px; font-weight: 400; line-height: 24px; color: var(--c-sub); }
.c3_024__c .dl { display: flex; align-items: center; justify-content: center; gap: 10px;
  height: 48px; margin-top: 18px; border: 1px solid var(--c-black); border-radius: 999px;
  font-size: 14px; font-weight: 700; }
.c3_024__c .dl i { font-size: 12px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf c3_024">
    <div class="wf__inner c3_024__wrap">
      <div class="c3_024__head"><p class="e en">DOWNLOAD</p><h2>ダミーテキスト見出し</h2></div>
      <div class="c3_024__list">
        <article class="c3_024__c"><div class="ph img" data-l="COVER"></div>
          <h3>ダミーテキストの資料タイトル</h3>
          <p>ダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
          <a class="dl" href="#"><i class="fa-solid fa-download"></i>ダウンロードする</a></article>
        <article class="c3_024__c"><div class="ph img" data-l="COVER"></div>
          <h3>ダミーテキストの資料タイトル</h3>
          <p>ダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
          <a class="dl" href="#"><i class="fa-solid fa-download"></i>ダウンロードする</a></article>
        <article class="c3_024__c"><div class="ph img" data-l="COVER"></div>
          <h3>ダミーテキストの資料タイトル</h3>
          <p>ダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
          <a class="dl" href="#"><i class="fa-solid fa-download"></i>ダウンロードする</a></article>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
