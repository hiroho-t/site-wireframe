<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col3-015</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   3カラム / 大きな番号＋正方形の画像＋見出し＋本文
   参考サイトのHTMLをDOM実測（1440幅・元の画像380角を310角に縮めて800に収めた）
   番号 80px/800（画像の右上に重ねる）／ 画像 310角 ／ 見出し 26px/500 lh1.35 ／ 本文 16px/500
   学びの流れ・提供価値を3ステップで見せるときに使う
   ============================================================ */
.col3_015 { background: var(--c-white); }
.col3_015__head { top: 83px; }
.col3_015__en { font-size: 11px; letter-spacing: .06em; color: var(--c-mute); }
.col3_015__ttl { margin-top: 10px; font-size: 30px; font-weight: 500; line-height: 1.5; }

.col3_015__cols { position: absolute; left: var(--wf-pad); top: 225px; width: var(--wf-content); display: flex; gap: 60px; }
.col3_015__c { width: 392px; }
.col3_015__ph { position: relative; width: 310px; height: 310px; }
.col3_015__no { position: absolute; right: -46px; top: -34px; font-size: 80px; font-weight: 800; line-height: 80px; color: var(--c-light); }
.col3_015__c h3 { margin-top: 34px; font-size: 26px; font-weight: 500; line-height: 1.35; }
.col3_015__c p { margin-top: 20px; font-size: 16px; font-weight: 500; line-height: 1.9; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col3_015">
    <div class="wf__inner col3_015__head">
      <p class="col3_015__en en">Dummy Text</p>
      <p class="col3_015__ttl">ダミーテキストで学べること</p>
    </div>

    <div class="col3_015__cols">
      <div class="col3_015__c">
        <div class="col3_015__ph img" data-l="IMAGE"><span class="col3_015__no en">01</span></div>
        <h3>ダミーテキストの<br>ダミーとダミーを学ぶ</h3>
        <p>ダミーテキストダミーテキストにおける、ダミーテキストダミーテキストを学びます。</p>
      </div>
      <div class="col3_015__c">
        <div class="col3_015__ph img" data-l="IMAGE"><span class="col3_015__no en">02</span></div>
        <h3>ダミーテキストを通じて<br>ダミーテキストを磨く</h3>
        <p>ダミーテキストでダミーテキストやダミーテキストをダミーテキストします。</p>
      </div>
      <div class="col3_015__c">
        <div class="col3_015__ph img" data-l="IMAGE"><span class="col3_015__no en">03</span></div>
        <h3>ダミーテキストと<br>ダミーテキストをつなぐ</h3>
        <p>ダミーテキストダミーテキストをダミーテキストにダミーテキストします。</p>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
