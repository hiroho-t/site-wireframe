<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>service-008</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   08 SERVICE / 英字56pxの見出し＋右にリード。下に大小カードを組み合わせたグリッド
   URLからDOM実測（1440幅）英字 56px/400 lh56 ＋ 和文 16px/600
   大カード 638×480（見出し24px/600＋英字10px/600）／ 小カード 317×238（見出し15px/600＋英字10px/600）
   ============================================================ */
.sv8 { background: var(--c-white); }
.sv8__head { position: absolute; left: 80px; top: 100px; display: flex; align-items: baseline; }
.sv8__en { font-size: 56px; font-weight: 400; line-height: 56px; letter-spacing: .01em; }
.sv8__jp { margin-left: 14px; font-size: 16px; font-weight: 600; line-height: 25.6px; }
.sv8__lead { position: absolute; left: 720px; top: 100px; width: 640px; font-size: 14px; line-height: 28px; color: var(--c-sub); }

.sv8__grid { position: absolute; left: 80px; top: 220px; }
.sv8__cell { position: absolute; }
.sv8__cell .ph { width: 100%; height: 100%; }
.sv8__cell .tx { position: absolute; left: 24px; bottom: 24px; color: var(--c-white); }
.sv8__cell .t1 { font-size: 24px; font-weight: 600; line-height: 38.4px; }
.sv8__cell .t2 { font-size: 15px; font-weight: 600; line-height: 24px; }
.sv8__cell .e { font-size: 10px; font-weight: 600; line-height: 16px; }
.sv8__a { left: 0; top: 0; width: 638px; height: 480px; }
.sv8__b { left: 642px; top: 0; width: 317px; height: 238px; }
.sv8__c { left: 963px; top: 0; width: 317px; height: 238px; }
.sv8__d { left: 642px; top: 242px; width: 317px; height: 238px; }
.sv8__e { left: 963px; top: 242px; width: 317px; height: 238px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf sv8">
    <div class="sv8__head">
      <span class="sv8__en en">Business</span>
      <span class="sv8__jp">ダミー項目</span>
    </div>
    <p class="sv8__lead">ダミーテキストのダミーテキストからダミーテキストのダミーテキスト・ダミーテキストダミーテキストダミーテキストまで、ダミーテキストダミーテキストします。</p>

    <div class="sv8__grid">
      <div class="sv8__cell sv8__a"><div class="ph img img--dark" data-l="IMAGE"></div>
        <div class="tx"><p class="t1">ダミーテキスト項目</p><p class="e en">Dummy Text Item</p></div></div>
      <div class="sv8__cell sv8__b"><div class="ph img img--dark" data-l="IMAGE"></div>
        <div class="tx"><p class="t2">ダミー項目名</p><p class="e en">Dummy Item</p></div></div>
      <div class="sv8__cell sv8__c"><div class="ph img img--dark" data-l="IMAGE"></div>
        <div class="tx"><p class="t2">ダミーテキスト項目</p><p class="e en">Dummy Item</p></div></div>
      <div class="sv8__cell sv8__d"><div class="ph img img--dark" data-l="IMAGE"></div>
        <div class="tx"><p class="t2">ダミー項目</p><p class="e en">Dummy Item</p></div></div>
      <div class="sv8__cell sv8__e"><div class="ph img img--dark" data-l="IMAGE"></div>
        <div class="tx"><p class="t2">ダミー項目名</p><p class="e en">Dummy Item</p></div></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
