<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>service-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   04 SERVICE / 左に見出し、右に「画像＋事業名＋サービス名＋本文」の行を縦に3つ
   URLからDOM実測（1440幅・行ピッチ235）
   英字ラベル 72px/200 ／ 画像 280×210 ／ 事業名 36px/400 ／ サービス名 14px/600
   本文 14px/300 lh28（幅611）
   ============================================================ */
.sv4 { background: var(--c-white); }
.sv4__left { position: absolute; left: var(--wf-pad); top: 97px; }
.sv4__en { font-size: 72px; font-weight: 200; line-height: 61px; letter-spacing: .02em; color: var(--c-mute); }
.sv4__lab { margin-top: 14px; font-size: 14px; font-weight: 600; line-height: 25.2px; }
.sv4__link { margin-top: 40px; display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 500; }
.sv4__link i { font-size: 10px; color: var(--c-mute); }

.sv4__rows { position: absolute; left: 466px; top: 61px; }
.sv4__row { display: flex; gap: 40px; margin-bottom: 25px; }
.sv4__row .ph { width: 280px; height: 210px; flex-shrink: 0; }
.sv4__row .tx { width: 582px; }
.sv4__row .hd { display: flex; align-items: baseline; gap: 24px; }
.sv4__row .hd h3 { font-size: 36px; font-weight: 400; line-height: 54px; }
.sv4__row .hd .nm { font-size: 14px; font-weight: 600; line-height: 14px; color: var(--c-mute); }
.sv4__row .tx p { margin-top: 20px; font-size: 14px; font-weight: 300; line-height: 28px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf sv4">
    <div class="sv4__left">
      <p class="sv4__en en">Services</p>
      <p class="sv4__lab">ダミー項目</p>
      <p class="sv4__link">ダミー項目について <i class="fa-solid fa-arrow-right"></i></p>
    </div>

    <div class="sv4__rows">
      <div class="sv4__row">
        <div class="ph img" data-l="IMAGE"></div>
        <div class="tx">
          <div class="hd"><h3>ダミーテキスト事業</h3><span class="nm">ダミー</span></div>
          <p>ダミーテキストダミーテキストで、ダミーテキストダミーテキストにはダミーテキストダミーテキストダミーテキストダミーです。</p>
        </div>
      </div>
      <div class="sv4__row">
        <div class="ph img" data-l="IMAGE"></div>
        <div class="tx">
          <div class="hd"><h3>ダミー事業</h3><span class="nm">ダミーテキスト</span></div>
          <p>ダミーテキストダミーテキストに特化したダミーテキスト・ダミーテキストダミーテキストです。</p>
        </div>
      </div>
      <div class="sv4__row">
        <div class="ph img" data-l="IMAGE"></div>
        <div class="tx">
          <div class="hd"><h3>ダミーダミー事業</h3><span class="nm en">Dummy Text</span></div>
          <p>ダミーテキストダミーテキストダミーテキストのダミーテキストとダミーテキストダミーです。</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
