<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-041</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   02 EVENT / 左に見出しブロック（固定336px）＋右に横型カード2枚
   左 見出し32px＋リード15px＋テキストリンク／右 小見出し19px＋サムネ220角＋テキスト
   カードは「サムネ左・テキスト右」の横型を2列×2行。上下中央（top 132px）
   ============================================================ */
.c2_041 { background: var(--c-white); }
.c2_041__wrap { top: 132px; display: flex; gap: 48px; }
.c2_041__l { width: 336px; flex: none; }
.c2_041__l h2 { font-size: 32px; font-weight: 700; line-height: 46px; letter-spacing: .04em; }
.c2_041__l p { margin-top: 20px; font-size: 15px; font-weight: 400; line-height: 22px; color: var(--c-sub); }
.c2_041__l .more { display: inline-flex; align-items: center; gap: 12px; margin-top: 30px; font-size: 17px; font-weight: 700; }
.c2_041__l .more i { font-size: 11px; }
.c2_041__r { flex: 1; }
.c2_041__r h3 { font-size: 19px; font-weight: 700; line-height: 28px; letter-spacing: .04em; }
.c2_041__list { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 24px; }
.c2_041__card { width: 436px; display: flex; gap: 24px; }
.c2_041__card .ph { width: 220px; height: 220px; flex: none; }
.c2_041__card .tt { font-size: 17px; font-weight: 700; line-height: 26px; }
.c2_041__card .meta { margin-top: 16px; font-size: 13px; font-weight: 500; line-height: 21px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf c2_041">
    <div class="wf__inner c2_041__wrap">
      <div class="c2_041__l">
        <h2>ダミー見出し</h2>
        <p>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
        <a class="more" href="#">ダミーテキストを見る<i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="c2_041__r">
        <h3>ダミーテキストの見出し</h3>
        <div class="c2_041__list">
          <div class="c2_041__card">
            <div class="ph img" data-l="IMAGE"></div>
            <div>
              <p class="tt">ダミーテキストダミー<br>テキストのタイトル</p>
              <p class="meta">2026/00/00（○）<br>ダミーテキスト会場</p>
            </div>
          </div>
          <div class="c2_041__card">
            <div class="ph img" data-l="IMAGE"></div>
            <div>
              <p class="tt">ダミーテキストの<br>タイトル</p>
              <p class="meta">2026/00/00（○）<br>ダミーテキスト会場</p>
            </div>
          </div>
          <div class="c2_041__card">
            <div class="ph img" data-l="IMAGE"></div>
            <div>
              <p class="tt">ダミーテキストの<br>タイトルが入ります</p>
              <p class="meta">2026/00/00（○）<br>ダミーテキスト会場</p>
            </div>
          </div>
          <div class="c2_041__card">
            <div class="ph img" data-l="IMAGE"></div>
            <div>
              <p class="tt">ダミーテキストダミー<br>テキストのタイトル</p>
              <p class="meta">2026/00/00（○）<br>ダミーテキスト会場</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
