<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   09 SERVICE / 英字130pxの見出し＋左右に振り分けた紹介ブロック
   URLからDOM実測（1440幅・元セクション高1976 → 800に収めるため1ブロックに）
   英字 130px/100 lh130 ＋ 和文 20px/300
   画像 735×420 ／ 見出し 30px/300 lh48 ＋ 英字 18px/400 ／ 本文 16px/300 lh32（幅475）
   ============================================================ */
.col2_024 { background: var(--c-bg-gray); }
.col2_024__head { position: absolute; left: 75px; top: 70px; display: flex; align-items: flex-end; gap: 8px; }
.col2_024__en { font-size: 130px; font-weight: 100; line-height: 130px; letter-spacing: .01em; }
.col2_024__jp { padding-bottom: 20px; font-size: 20px; font-weight: 300; line-height: 20px; }

.col2_024__ph { position: absolute; left: 630px; top: 300px; width: 735px; height: 420px; }
.col2_024__tx { position: absolute; left: 75px; top: 380px; width: 475px; }
.col2_024__tx h3 { font-size: 30px; font-weight: 300; line-height: 48px; }
.col2_024__tx .e { font-size: 18px; font-weight: 400; line-height: 28.8px; color: var(--c-mute); }
.col2_024__tx p { margin-top: 26px; font-size: 16px; font-weight: 300; line-height: 32px; color: var(--c-sub); }
.col2_024__tx .link { margin-top: 40px; display: flex; align-items: center; gap: 18px; font-size: 15px; }
.col2_024__tx .cir {
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--c-sub);
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf col2_024">
    <div class="col2_024__head">
      <span class="col2_024__en en">Dummy</span>
      <span class="col2_024__jp">ダミー項目</span>
    </div>

    <div class="col2_024__ph img" data-l="IMAGE"></div>
    <div class="col2_024__tx">
      <h3>ダミーテキストサービス</h3>
      <p class="e en">Dummy text</p>
      <p>ダミーテキストやダミーテキスト、ダミーテキストなど、ダミーテキストダミーテキストをご提供します。</p>
      <p class="link"><span class="en">View all</span><span class="cir"><i class="fa-solid fa-arrow-right"></i></span></p>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
