<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-030</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   04 CAREER / 左にテキスト、右に写真タイルのグリッド
   URLからDOM実測（1440幅）。元は2列のタイルが上下に流れるアニメーション →
   ルールに従い 2列×2行の静止グリッドに正規化した
   英字ラベル 72px/200 ／ コピー 42px/500 lh63 ／ 本文 14px/400 lh28
   タイル 255×307・gap24
   ============================================================ */
.col2_030 { background: var(--c-bg-gray); }
.col2_030__tx { position: absolute; left: var(--wf-pad); top: 140px; width: 424px; }
.col2_030__en { font-size: 72px; font-weight: 200; line-height: 61px; letter-spacing: .02em; color: var(--c-mute); }
.col2_030__lab { margin-top: 14px; font-size: 14px; font-weight: 600; line-height: 25.2px; }
.col2_030__ttl { margin-top: 22px; font-size: 42px; font-weight: 500; line-height: 63px; }
.col2_030__body { margin-top: 20px; font-size: 14px; line-height: 28px; color: var(--c-sub); }
.col2_030__link { margin-top: 40px; display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 500; }
.col2_030__link i { font-size: 10px; color: var(--c-mute); }

.col2_030__grid { position: absolute; left: 758px; top: 82px; display: flex; flex-wrap: wrap; gap: 24px; width: 534px; }
.col2_030__grid .ph { width: 255px; height: 307px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col2_030">
    <div class="col2_030__tx">
      <p class="col2_030__en en">Dummy</p>
      <p class="col2_030__lab">ダミー項目</p>
      <h2 class="col2_030__ttl">ダミーテキストの<br>ダミーをつくりだそう。</h2>
      <p class="col2_030__body">
        ダミーテキストダミーは、ダミーテキストダミーテキストという<br>
        ダミーテキストダミーテキストダミーテキストダミーテキスト<br>
        ダミーテキストダミーテキストです。
      </p>
      <p class="col2_030__link">ダミー項目 <i class="fa-solid fa-arrow-right"></i></p>
    </div>

    <div class="col2_030__grid">
      <div class="ph img" data-l="IMAGE"></div>
      <div class="ph img" data-l="IMAGE"></div>
      <div class="ph img" data-l="IMAGE"></div>
      <div class="ph img" data-l="IMAGE"></div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
