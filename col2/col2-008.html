<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-008</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   03 MESSAGE / 帯状の背景画像の上に、左に和文大見出し・右に本文＋丸ボタン
   URLからDOM実測（1440幅・元セクション高562を800の中央に配置）
   見出し 40px/700 lh52 ／ 本文 20px/700 lh36（幅510）／ リンク 18px/700＋丸64
   ============================================================ */
.col2_008 { background: var(--c-white); }
.col2_008__band { position: absolute; left: 0; top: 200px; width: 1440px; height: 382px; }
/* 帯（200〜582）の上下中央に見出しと本文ブロックを合わせる */
.col2_008__ttl { position: absolute; left: 190px; top: 365px; font-size: 40px; font-weight: 700; line-height: 52px; color: var(--c-white); }
.col2_008__tx { position: absolute; left: 740px; top: 288px; width: 510px; }
.col2_008__body { font-size: 20px; font-weight: 700; line-height: 36px; color: var(--c-white); }
.col2_008__link { margin-top: 46px; display: flex; align-items: center; gap: 22px; font-size: 18px; font-weight: 700; line-height: 25.2px; color: var(--c-white); }
.col2_008__link .cir {
  width: 64px; height: 64px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.7);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf col2_008">
    <div class="col2_008__band img img--dark" data-l="IMAGE"></div>
    <h2 class="col2_008__ttl">私たちの想い</h2>
    <div class="col2_008__tx">
      <p class="col2_008__body">ダミーテキストダミーテキストを構え、ダミーテキストに合わせたダミーテキストダミーテキストダミーテキストをご提案します。</p>
      <p class="col2_008__link"><span class="en">VIEW MORE</span><span class="cir"><i class="fa-solid fa-arrow-right"></i></span></p>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
