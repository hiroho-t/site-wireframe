<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-047</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   02 ACCESS / 左に地図660×420、右に住所・TEL＋交通手段リスト
   交通手段＝アイコン＋見出し15px＋本文14px を3件。実店舗・拠点ページに
   上下中央（top 177px）
   ============================================================ */
.c2_047 { background: var(--c-white); }
.c2_047__wrap { top: 177px; display: flex; gap: 56px; align-items: flex-start; }
.c2_047__map { width: 660px; height: 420px; flex: none; }
.c2_047__r { flex: 1; }
.c2_047__r .e { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: .12em; color: var(--c-mute); }
.c2_047__r h2 { margin-top: 8px; font-size: 28px; font-weight: 700; line-height: 42px; letter-spacing: .04em; }
.c2_047__addr { margin-top: 20px; font-size: 15px; font-weight: 400; line-height: 26px; }
.c2_047__tel { margin-top: 6px; font-size: 17px; font-weight: 700; line-height: 27px; }
.c2_047__ways { margin-top: 26px; border-top: 1px solid var(--c-line); }
.c2_047__w { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--c-line); }
.c2_047__w i { width: 20px; flex: none; margin-top: 3px; font-size: 15px; color: var(--c-mute); text-align: center; }
.c2_047__w h3 { font-size: 15px; font-weight: 700; line-height: 22px; }
.c2_047__w p { margin-top: 4px; font-size: 14px; font-weight: 400; line-height: 22px; color: var(--c-sub); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf c2_047">
    <div class="wf__inner c2_047__wrap">
      <div class="c2_047__map img" data-l="MAP"></div>
      <div class="c2_047__r">
        <p class="e en">ACCESS</p>
        <h2>ダミーテキスト見出し</h2>
        <p class="c2_047__addr">〒000-0000<br>ダミーテキスト県ダミー市ダミー町0丁目0-0 ダミービル0F</p>
        <p class="c2_047__tel"><span class="en">TEL.</span> 000-000-0000</p>
        <div class="c2_047__ways">
          <div class="c2_047__w"><i class="fa-solid fa-train"></i><div><h3>電車でお越しの方</h3><p>ダミー線「ダミー駅」ダミー口より徒歩0分</p></div></div>
          <div class="c2_047__w"><i class="fa-solid fa-bus"></i><div><h3>バスでお越しの方</h3><p>ダミーバス「ダミー停留所」下車 徒歩0分</p></div></div>
          <div class="c2_047__w"><i class="fa-solid fa-car"></i><div><h3>お車でお越しの方</h3><p>ダミー道路「ダミーIC」より約00分／駐車場00台</p></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
