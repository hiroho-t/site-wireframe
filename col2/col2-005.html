<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   06 ABOUT / 左に小ラベル＋72pxの大見出し＋本文＋ボタン、右に大きな画像
   URLからDOM実測（1440幅・元セクション高773を800の中央に配置）
   小ラベル 14px/500 lh20（2行）／ 見出し 72px/600 lh100.8 の2行
   本文 15px/500 lh33（幅374）／ ボタン 16px/500
   ============================================================ */
.col2_005 { background: var(--c-white); }
.col2_005__tx { position: absolute; left: 108px; top: 105px; width: 560px; }
.col2_005__lab { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--c-mute); }
.col2_005__ttl { margin-top: 12px; font-size: 72px; font-weight: 600; line-height: 100.8px; }
.col2_005__body { margin-top: 20px; font-size: 15px; font-weight: 500; line-height: 33px; color: var(--c-sub); }
.col2_005__btn {
  margin-top: 42px; height: 52px; width: 200px; border-radius: 26px;
  border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; gap: 16px;
  font-size: 16px; font-weight: 500;
}
.col2_005__ph { position: absolute; left: 728px; top: 71px; width: 663px; height: 657px; border-radius: 12px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col2_005">
    <div class="col2_005__tx">
      <p class="col2_005__lab en">Dummy One<br>Dummy Two</p>
      <h2 class="col2_005__ttl">ダミーで、<br>ダミーな解を。</h2>
      <p class="col2_005__body">
        ダミーテキストのダミーテキストは、「ダミーテキスト」を探すこと。<br>
        ダミーテキストなだけでなく、ダミーテキストな、ダミーテキストな解を。<br>
        ダミーテキストが生まれるダミーテキスト、ダミーテキストだから。<br>
        ダミーテキストとダミーテキストのダミーテキストだから、<br>
        ダミーテキストにひとつしかないダミーテキストが生まれる。
      </p>
      <div class="col2_005__btn">ダミーを知る <i class="fa-solid fa-arrow-right"></i></div>
    </div>
    <div class="col2_005__ph img" data-l="IMAGE"></div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
