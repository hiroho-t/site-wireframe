<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-023</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   07 SERVICE / 英字の特大見出し＋2カラムのサービスカード
   URLからDOM実測（1440幅・元セクション高1114 → 800に収めるため英字を150→76px、画像を413→280に縮小）
   ラベル 20px/700 ／ 英字見出し 76px/700 lh68 の2行
   カード 620幅：画像620×280＋見出し26px/700＋丸アイコン24＋本文16px/500 lh27.2
   ============================================================ */
.col2_023 { background: var(--c-white); }
.col2_023__lab { position: absolute; left: 80px; top: 40px; font-size: 20px; font-weight: 700; line-height: 26px; }
.col2_023__en { position: absolute; left: 80px; top: 82px; font-size: 76px; font-weight: 700; line-height: 68px; letter-spacing: .01em; color: var(--c-mute); }

.col2_023__cards { position: absolute; left: 80px; top: 250px; display: flex; gap: 40px; }
.col2_023__card { width: 620px; }
.col2_023__card .ph { width: 620px; height: 280px; }
.col2_023__card .hd { margin-top: 24px; display: flex; align-items: center; gap: 18px; }
.col2_023__card h3 { font-size: 26px; font-weight: 700; line-height: 33.8px; }
.col2_023__card .cir {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--c-sub);
}
.col2_023__card p { margin-top: 18px; font-size: 16px; font-weight: 500; line-height: 27.2px; color: var(--c-sub); }

.col2_023__link { position: absolute; right: 80px; top: 680px; display: flex; align-items: center; gap: 22px; font-size: 18px; font-weight: 700; }
.col2_023__link .cir {
  width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--c-line);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf col2_023">
    <p class="col2_023__lab">ダミー・ダミー項目</p>
    <p class="col2_023__en en">Business･<br>Dummy</p>

    <div class="col2_023__cards">
      <div class="col2_023__card">
        <div class="ph img" data-l="IMAGE"></div>
        <div class="hd"><h3>ダミー項目名</h3><span class="cir"><i class="fa-solid fa-arrow-right"></i></span></div>
        <p>ダミーテキストダミーテキストのダミーテキストとダミーテキスト・ダミーテキストを保つ</p>
      </div>
      <div class="col2_023__card">
        <div class="ph img" data-l="IMAGE"></div>
        <div class="hd"><h3>ダミー項目名</h3><span class="cir"><i class="fa-solid fa-arrow-right"></i></span></div>
        <p>ダミーテキストをダミーテキストに済む、ダミーテキストに適したダミーテキスト</p>
      </div>
    </div>

    <p class="col2_023__link"><span class="en">BUSINESS･SERVICE</span><span class="cir"><i class="fa-solid fa-arrow-right"></i></span></p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
