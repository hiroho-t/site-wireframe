<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>col2-022</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   06 SERVICE / 見出しの下に「番号＋見出し24px＋本文＋右に画像」の行を並べる
   URLからDOM実測（1440幅・行ピッチ268 → 元3行を800に収めるため2行）
   英字 64px/500 ／ 和文 20px/500 ／ 番号 16px/400 ／ 見出し 24px/500 lh36
   本文 16px/400 lh28（幅788）／ 画像 359×202
   ============================================================ */
.col2_022 { background: var(--c-white); }
.col2_022__head { position: absolute; left: var(--wf-pad); top: 73px; }
.col2_022__en { font-size: 64px; font-weight: 500; line-height: 64px; letter-spacing: .01em; }
.col2_022__jp { margin-top: 8px; font-size: 20px; font-weight: 500; line-height: 30px; }

.col2_022__rows { position: absolute; left: 122px; top: 258px; width: 1246px; }
.col2_022__row { display: flex; align-items: flex-start; padding-bottom: 62px; }
.col2_022__row .tx { width: 788px; }
.col2_022__row .no { font-size: 16px; line-height: 16px; color: var(--c-mute); }
.col2_022__row h3 { margin-top: 4px; font-size: 24px; font-weight: 500; line-height: 36px; }
.col2_022__row p { margin-top: 16px; font-size: 16px; line-height: 28px; color: var(--c-sub); }
.col2_022__row .ph { margin-left: auto; width: 359px; height: 202px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf col2_022">
    <div class="col2_022__head">
      <p class="col2_022__en en">Dummy</p>
      <p class="col2_022__jp">ダミー項目</p>
    </div>

    <div class="col2_022__rows">
      <div class="col2_022__row">
        <div class="tx">
          <p class="no en">01</p>
          <h3>ダミーテキスト事業</h3>
          <p>ダミーテキスト・ダミーテキスト・ダミーテキストなど、すべてのダミーテキストをダミーテキストダミーテキストダミーテキストします。ダミーテキストダミーテキストダミーです。</p>
        </div>
        <div class="ph img" data-l="IMAGE"></div>
      </div>
      <div class="col2_022__row">
        <div class="tx">
          <p class="no en">02</p>
          <h3>ダミーテキストダミー事業</h3>
          <p>ダミーテキストなダミーテキストとダミーテキストでダミーテキストにダミーテキストされ、ダミーテキストダミーテキストダミーテキストしています。</p>
        </div>
        <div class="ph img" data-l="IMAGE"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
