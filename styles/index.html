<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code用のデザイン参考集</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff; --ink:#141414; --sub:#767676; --line:#e6e4e2; --field:#f4f3f1; --r:6px }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.9}

  header{padding:40px 32px 24px;border-bottom:1px solid var(--line)}
  h1{font-size:19px;font-weight:700;letter-spacing:.04em}
  header p{margin-top:10px;font-size:13px;color:var(--sub);max-width:640px}
  header code{background:var(--field);padding:1px 5px;border-radius:4px;font-size:12px}

  .bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:14px 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  #q{flex:1 1 240px;max-width:360px;height:38px;padding:0 12px;font:inherit;font-size:13px;
    border:1px solid var(--line);border-radius:var(--r);background:var(--field);color:var(--ink)}
  #q:focus{outline:2px solid var(--ink);outline-offset:-1px;background:#fff}
  .count{font-size:12px;color:var(--sub)}

  main{padding:28px 32px 64px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
  .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .shot{display:block;aspect-ratio:16/10;overflow:hidden;background:var(--field);border-bottom:1px solid var(--line)}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .head{text-decoration:none;color:inherit;display:block}
  .head:hover .name{text-decoration:underline;text-underline-offset:3px}
  .name{font-size:14px;font-weight:700;line-height:1.5}
  .meta{font-size:11px;color:var(--sub);line-height:1.7}
  .sw{display:flex;border-radius:4px;overflow:hidden;height:14px;border:1px solid var(--line)}
  .sw i{min-width:6px;box-shadow:1px 0 0 var(--line) inset}
  .sw i:first-child{box-shadow:none}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tags span{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 8px;line-height:1.6}
  .act{display:flex;gap:8px;margin-top:auto;padding-top:4px}
  .act button,.act a{flex:1;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;
    font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:var(--r);cursor:pointer;
    text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:#fff}
  .act button:hover{opacity:.78}
  .act button.done{background:#fff;color:var(--ink);border-color:var(--ink)}

  footer{border-top:1px solid var(--line);padding:28px 32px 56px;font-size:12px;color:var(--sub)}
  footer p{max-width:720px}
  footer a{color:var(--ink)}
  .empty{color:var(--sub);font-size:13px;padding:40px 0}
  @media (max-width:640px){ header,.bar,main,footer{padding-left:20px;padding-right:20px} }
</style>
</head>
<body>

<header>
  <h1>Claude Code用のデザイン参考集</h1>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="サイト名・業種・印象でしぼる" autocomplete="off">
  <span class="count" id="count"></span>
</div>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>見つかりませんでした。</div></main>

<footer>
  <p>スクリーンショットの掲載を希望されない場合はご連絡ください、確認のうえ削除します。</p>
  <p style="margin-top:12px">運営：<a href="https://startwith.org/" target="_blank" rel="noopener">合同会社StartWith</a></p>
</footer>

<script>
const grid = document.getElementById('grid'), q = document.getElementById('q');
const countEl = document.getElementById('count'), empty = document.getElementById('empty');
let items = [];

fetch('data.json').then(r => r.json()).then(d => { items = d; render(); })
  .catch(() => { grid.innerHTML = '<p class="empty">data.json が読めません。file:// ではなく簡易サーバー経由で開いてください。</p>'; });

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const w = q.value.trim().toLowerCase();
  const hit = items.filter(x => !w ||
    [x.name, x.industry, ...(x.tags || [])].join(' ').toLowerCase().includes(w));
  countEl.textContent = hit.length + ' / ' + items.length + ' サイト';
  empty.hidden = hit.length > 0;
  grid.innerHTML = hit.map(x => `
    <article class="card">
      <a class="shot" href="p/${esc(x.slug)}.html">
        <img src="shot/${esc(x.slug)}.jpg" alt="${esc(x.name)} のトップページ" loading="lazy">
      </a>
      <div class="body">
        <a class="head" href="p/${esc(x.slug)}.html">
          <p class="name">${esc(x.name)}</p>
          <p class="meta">${esc(x.industry || '')}</p>
        </a>
        <div class="sw">${(x.palette || []).map(c => `<i style="background:${esc(c.hex)};flex:${c.pct}"></i>`).join('')}</div>
        <div class="tags">${(x.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <div class="act">
          <button data-slug="${esc(x.slug)}">mdをコピー</button>
        </div>
      </div>
    </article>`).join('');
}

q.addEventListener('input', render);

// カードのコピー：md の中身をそのままクリップボードへ（ファイルは作らない）
grid.addEventListener('click', async e => {
  const b = e.target.closest('button[data-slug]');
  if (!b) return;
  const before = b.textContent;
  try {
    const md = await fetch('s/' + b.dataset.slug + '.md').then(r => r.text());
    await navigator.clipboard.writeText(md);
    b.textContent = 'mdをコピーしました'; b.classList.add('done');
  } catch { b.textContent = 'コピーできません'; }
  setTimeout(() => { b.textContent = before; b.classList.remove('done'); }, 1600);
});
</script>
</body>
</html>
