<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-015</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}


/* ============================================================
   FOOTER / 店舗・医院の情報型フッター
   左 ロゴ＋住所＋TEL/FAX＋営業時間表＋注記＋予約ボタン／右 地図
   実店舗を持つサイト向け。サイトマップではなく「行くための情報」を置く
   ============================================================ */
.ft15 { background: var(--c-white); }
.ft15__l { position: absolute; left: var(--wf-pad); top: 185px; width: 600px; }
.ft15__logo { font-size: 26px; font-weight: 700; letter-spacing: .06em; line-height: 34px; }
.ft15__addr { margin-top: 24px; display: flex; align-items: baseline; gap: 8px; font-size: 16px; font-weight: 400; line-height: 26px; }
.ft15__addr a { font-size: 12px; text-decoration: underline; color: var(--c-sub); }
.ft15__tel { margin-top: 8px; display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 500; line-height: 27px; }
.ft15__tel span.l { font-family: "Poppins", sans-serif; }
.ft15__hours { margin-top: 28px; width: 506px; border-collapse: collapse; }
.ft15__hours th, .ft15__hours td { border: 1px solid var(--c-line); height: 30px; font-size: 13px; font-weight: 400; text-align: center; }
.ft15__hours th { background: var(--c-bg-gray); font-weight: 500; }
.ft15__hours td.t { width: 146px; text-align: left; padding-left: 12px; }
.ft15__note { margin-top: 16px; width: 506px; font-size: 13px; font-weight: 400; line-height: 21px; color: var(--c-sub); }
.ft15__note strong { font-weight: 700; color: var(--c-text); }
.ft15__btns { display: flex; gap: 16px; margin-top: 26px; }
.ft15__btns a { display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 48px; padding: 0 28px; font-size: 15px; font-weight: 600; }
.ft15__btns a.line2 { border: 1px solid var(--c-black); border-radius: 999px; }
.ft15__map { position: absolute; left: 744px; top: 185px; width: 624px; height: 374px; }
.ft15__copy { position: absolute; left: 0; bottom: 0; width: 100%; height: 56px;
  display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--c-line);
  font-size: 11px; letter-spacing: .04em; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf ft15">
    <div class="ft15__l">
      <p class="ft15__logo en">LOGO</p>
      <p class="ft15__addr">〒000-0000　ダミーテキスト県ダミー市ダミー町0丁目0-0<a href="#">（Google map）</a></p>
      <p class="ft15__tel"><span class="l">TEL.</span>000-000-0000　<span class="l">FAX.</span>000-000-0000</p>
      <table class="ft15__hours">
        <tr><th class="t"></th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th><th>日</th></tr>
        <tr><td class="t">00:00 - 00:00</td><td>●</td><td>●</td><td>●</td><td>—</td><td>●</td><td>●</td><td>—</td></tr>
        <tr><td class="t">00:00 - 00:00</td><td>●</td><td>●</td><td>—</td><td>—</td><td>●</td><td>—</td><td>—</td></tr>
      </table>
      <p class="ft15__note"><strong>※ダミーテキストダミーテキスト。</strong>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストです。</p>
      <div class="ft15__btns">
        <a class="btn-black" href="#">ダミー項目<i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        <a class="line2" href="#"><i class="fa-solid fa-phone"></i>000-000-0000</a>
      </div>
    </div>
    <div class="ft15__map img" data-l="MAP"></div>
    <p class="ft15__copy en">© 2026 Dummy Company. All Rights Reserved.</p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
