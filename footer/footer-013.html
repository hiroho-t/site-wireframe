<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-013</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   13 FOOTER / 親子2階層のサイトマップを4カラムで並べる
   URLからDOM実測（1440幅）親 16px/600 lh20.8 ／ 子 14px/500 lh18.2（ピッチ35）
   ============================================================ */
.ft13 { background: var(--c-bg-gray); }
.ft13__cols { position: absolute; left: 50px; top: 140px; width: 1340px; display: flex; gap: 40px; }
.ft13__col { width: 300px; }
.ft13__col h3 { font-size: 16px; font-weight: 600; line-height: 20.8px; }
.ft13__col h3 + h3 { margin-top: 42px; }
.ft13__col .sub { margin-top: 18px; }
.ft13__col .sub li { margin-bottom: 17px; font-size: 14px; font-weight: 500; line-height: 18.2px; color: var(--c-sub); }
.ft13__btm { position: absolute; left: 50px; top: 640px; width: 1340px; display: flex; align-items: center; }
.ft13__logo { font-size: 22px; font-weight: 700; letter-spacing: .06em; }
.ft13__copy { margin-left: auto; font-size: 12px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf ft13">
    <div class="ft13__cols">
      <div class="ft13__col">
        <h3>ダミーを知る</h3>
        <ul class="sub">
          <li>ダミーテキストの特徴</li>
          <li>ダミーテキストが大切にしていること</li>
          <li>ダミー項目名</li>
          <li>ダミー・ダミー・ダミーテキスト</li>
        </ul>
      </div>
      <div class="ft13__col">
        <h3>ダミーテキストを知る</h3>
        <ul class="sub">
          <li>ダミーテキストのダミーテキスト</li>
          <li>ダミーテキストで見るダミーテキスト</li>
          <li>ダミー項目名</li>
        </ul>
      </div>
      <div class="ft13__col">
        <h3>ダミー項目を知る</h3>
        <ul class="sub">
          <li>ダミー項目名</li>
          <li>ダミーテキスト項目</li>
          <li>ダミー項目</li>
        </ul>
      </div>
      <div class="ft13__col">
        <h3>ダミー項目名</h3>
        <ul class="sub">
          <li>ダミー項目</li>
          <li>ダミー項目名</li>
        </ul>
        <h3>ダミー項目名称</h3>
      </div>
    </div>

    <div class="ft13__btm">
      <div class="ft13__logo en">LOGO</div>
      <span class="ft13__copy en">© 20XX Company Inc.</span>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
