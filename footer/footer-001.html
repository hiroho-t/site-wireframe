<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ===== 90 FOOTER / フッター ===== */
.footer { background: var(--c-white); }

/* 上部バナー3カラム */
.footer__cards {
  position: absolute; left: var(--wf-pad); top: 85px;
  width: var(--wf-content);
  display: flex; gap: 30px;
}
.footer__card {
  position: relative;
  width: 412px; height: 205px;
  border-radius: 24px;
}
.footer__card-label {
  position: absolute; left: 15px; bottom: 15px;
  height: 30px; padding: 0 20px;
  font-size: 13px; line-height: 1;
}

/* 中央の縦罫線 */
.footer__divider {
  position: absolute; left: 720px; top: 353px;
  width: 1px; height: 366px;
  background: var(--c-line);
}

/* 左カラム */
.footer__addr {
  position: absolute; left: var(--wf-pad); top: 469px;
  font-size: 13px; line-height: 22.5px; color: var(--c-text);
}
.footer__sns {
  position: absolute; left: var(--wf-pad); top: 538px;
  font-size: 13px; line-height: 1; letter-spacing: .02em;
  color: var(--c-text);
}
.footer__sns span { margin: 0 12px; }
.footer__copy {
  position: absolute; left: var(--wf-pad); top: 577px;
  font-size: 13px; line-height: 1.4; color: var(--c-light);
}

/* 右カラム */
.footer__tel {
  position: absolute; left: 922px; top: 423px;
  font-size: 36px; font-weight: 500; line-height: 1; color: var(--c-text);
}
.footer__hours {
  position: absolute; left: 922px; top: 475px;
  font-size: 15px; line-height: 1.2; color: var(--c-text);
}
.footer__contact {
  position: absolute; left: 909px; top: 560px;
  width: 359px; height: 90px;
  font-size: 14px; font-weight: 500;
  gap: 18px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf footer">

    <!-- 上部バナー（画像＝グレーボックス） -->
    <div class="footer__cards">
      <div class="footer__card img">
        <span class="footer__card-label tag-white">ダミーテキスト項目</span>
      </div>
      <div class="footer__card img">
        <span class="footer__card-label tag-white">ダミーテキスト項目名称</span>
      </div>
      <div class="footer__card img">
        <span class="footer__card-label tag-white">ダミー項目名称</span>
      </div>
    </div>

    <!-- 縦罫線 -->
    <div class="footer__divider"></div>

    <!-- 左：住所・SNS・コピーライト -->
    <p class="footer__addr">
      〒000-0000<br>
      ダミー県ダミー市ダミー町0-0-0 ダミービル0F
    </p>
    <p class="footer__sns en">LINK01<span>/</span>LINK02</p>
    <p class="footer__copy en">© 20XX Company.</p>

    <!-- 右：TEL・営業時間・お問い合わせボタン -->
    <p class="footer__tel en">Tel. 00-0000-0000</p>
    <p class="footer__hours"><span class="sep">ダミー項目</span>ダミー 0:00〜00:00（ダミーは除く）</p>
    <div class="footer__contact btn-black">
      <span>ダミーテキストダミーテキスト</span>
      <i class="fa-solid fa-circle dot"></i>
    </div>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
