<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   07 FOOTER / 左にロゴ、右にサイトマップ3列。下部に小さなポリシーリンク
   URLからDOM実測（1440幅・セクション高505を800の中央に配置）
   ロゴ 326×34＋英字16/500 ／ 列見出し14/500 lh22.4 ／ リンク15/500 lh24（行ピッチ44）
   ポリシーリンク 11/400 lh17.6
   ============================================================ */
.ft7 { background: var(--c-white); }
.ft7__logo { position: absolute; left: var(--wf-pad); top: 206px; font-size: 26px; font-weight: 700; letter-spacing: .06em; line-height: 34px; }
.ft7__logo small { display: block; margin-top: 22px; font-size: 16px; font-weight: 500; line-height: 17.6px; letter-spacing: 0; }

.ft7__col { position: absolute; top: 206px; }
.ft7__col h3 { font-size: 14px; font-weight: 500; line-height: 22.4px; color: var(--c-mute); }
.ft7__col li { margin-top: 22px; font-size: 15px; font-weight: 500; line-height: 24px; }
.ft7__col.c2 { left: 513px; }
.ft7__col.c3 { left: 789px; width: 400px; }
.ft7__col.c3 ul { display: flex; flex-wrap: wrap; }
.ft7__col.c3 li { width: 179px; }
.ft7__col.c4 { left: 1163px; }
.ft7__col.c4 .sns { display: flex; align-items: center; gap: 12px; }
.ft7__col.c4 .corp { margin-top: 44px; font-size: 13px; font-weight: 600; line-height: 19.5px; }

.ft7__policy { position: absolute; left: var(--wf-pad); top: 580px; display: flex; gap: 26px; font-size: 11px; line-height: 17.6px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf ft7">
    <div class="ft7__logo en">LOGO<small>Dummy Site</small></div>

    <div class="ft7__col c2">
      <h3>ダミー項目</h3>
      <ul>
        <li>ダミー項目</li>
        <li>ダミー項目 ダミー</li>
        <li>ダミー ダミー項目</li>
        <li>ダミー項目 ダミー</li>
      </ul>
    </div>

    <div class="ft7__col c3">
      <h3>ダミーテキスト項目</h3>
      <ul>
        <li>ダミー項目名</li>
        <li>ダミー項目名</li>
        <li>ダミー項目名称</li>
        <li>ダミー項目</li>
        <li>ダミー項目名称</li>
        <li>ダミー項目名称</li>
      </ul>
    </div>

    <div class="ft7__col c4">
      <h3>ダミーをもっと知る</h3>
      <ul>
        <li class="sns"><i class="fa-brands fa-instagram"></i><span class="en">Instagram</span></li>
        <li class="sns"><i class="fa-brands fa-x-twitter"></i><span class="en">X</span></li>
      </ul>
      <p class="corp">ダミーテキストサイト</p>
    </div>

    <div class="ft7__policy">
      <span>ダミーテキスト方針</span>
      <span>ダミーテキストの取扱いについて</span>
      <span>ダミーガイドライン</span>
      <span>ダミーテキストポリシー</span>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
