<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-010</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   10 FOOTER / 左にロゴ、中央にリンク列。下にポリシーリンクとコピーライト
   URLからDOM実測（1440幅・元セクション高900 → 800に収めるため上下を詰める）
   リンク 16px/700 lh22.4（ピッチ36.5）／ ポリシー 14px/400（ピッチ33）
   コピーライト 14px/400 ／ PAGE TOP 18px/700
   ============================================================ */
.ft10 { background: var(--c-bg-gray); }
.ft10__logo { position: absolute; left: 80px; top: 166px; font-size: 26px; font-weight: 700; letter-spacing: .06em; }
.ft10__nav { position: absolute; left: 630px; top: 162px; width: 210px; }
.ft10__nav li { font-size: 16px; font-weight: 700; line-height: 22.4px; margin-bottom: 14px; }

.ft10__policy { position: absolute; left: 630px; top: 409px; }
.ft10__policy li { font-size: 14px; line-height: 23.8px; margin-bottom: 19px; color: var(--c-sub); }
.ft10__copy { position: absolute; left: 80px; top: 620px; width: 1280px; font-size: 14px; line-height: 21px; color: var(--c-mute); }
.ft10__top { position: absolute; left: 1193px; top: 595px; font-size: 18px; font-weight: 700; line-height: 18px; }
</style>
</head>
<body>
<div class="stage">
  <div class="wf ft10">
    <div class="ft10__logo en">LOGO</div>

    <ul class="ft10__nav">
      <li>ダミー項目</li>
      <li>ダミーテキストについて</li>
      <li>ダミー項目名</li>
      <li>ダミー・ダミー項目</li>
      <li>ダミー項目</li>
      <li>ダミー項目名</li>
    </ul>

    <ul class="ft10__policy">
      <li>ダミーテキストポリシー</li>
      <li>ダミーテキストガイドライン</li>
      <li>ダミーポリシー</li>
      <li>ダミーテキストに基づく表記</li>
    </ul>

    <p class="ft10__copy en">© 20XX COMPANY CORP.</p>
    <p class="ft10__top en">PAGE TOP</p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
