<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-011</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   11 FOOTER / 左にロゴ＋タグライン、右にリンク2列。下にポリシーとコピーライト
   URLからDOM実測（1440幅・元セクション高539を800の中央に配置）
   ロゴ LOGOテキスト（22px/700・行高27）／ タグライン 18px/600 ／ リンク 12px/600 lh19.2（ピッチ43）
   ポリシー 12px/400 ／ コピーライト 11px/400
   ============================================================ */
.ft11 { background: var(--c-white); }
.ft11__logo { position: absolute; left: 80px; top: 231px; font-size: 22px; font-weight: 700; letter-spacing: .06em; line-height: 27px; }
.ft11__tag { position: absolute; left: 80px; top: 298px; font-size: 18px; font-weight: 600; line-height: 18px; }
.ft11__c1 { position: absolute; left: 740px; top: 232px; }
.ft11__c2 { position: absolute; left: 1070px; top: 232px; }
.ft11__c1 li, .ft11__c2 li { margin-bottom: 26px; font-size: 12px; font-weight: 600; line-height: 19.2px; }
.ft11__policy { position: absolute; left: 80px; top: 520px; font-size: 12px; line-height: 19.2px; color: var(--c-sub); }
.ft11__copy { position: absolute; left: 80px; top: 554px; width: 1280px; font-size: 11px; line-height: 17.6px; color: var(--c-mute); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf ft11">
    <div class="ft11__logo en">LOGO</div>
    <p class="ft11__tag">ダミーを、ダミーに。</p>

    <ul class="ft11__c1">
      <li>ダミー項目</li><li>ダミー項目名</li><li>ダミー項目名</li>
      <li>ダミーテキスト項目</li><li>ダミー項目名</li>
    </ul>
    <ul class="ft11__c2">
      <li>ダミー項目名</li><li>ダミー項目</li><li>ダミー項目名</li><li>ダミー項目名</li>
    </ul>

    <p class="ft11__policy">ダミーテキスト保護方針について</p>
    <p class="ft11__copy en">© 20XX Company Co., Ltd. All Rights Reserved.</p>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
