<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
.dot { font-size: 8px; line-height: 1; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   06 FOOTER / 左にロゴ、右にリンク3行＋SNSアイコン縦並び。下に罫線＋コピーライト＋PageTopの丸
   実測（1440基準）ロゴ h44 ／ リンク 14px lh30 ／ SNS φ26 縦gap12
   ============================================================ */
.ft6 { background: var(--c-white); }
.ft6__top { top: 268px; display: flex; align-items: flex-start; }
.ft6__logo { font-size: 26px; font-weight: 700; letter-spacing: .06em; }
.ft6__links { margin-left: auto; font-size: 14px; line-height: 30px; color: var(--c-sub); text-align: right; }
.ft6__sns { margin-left: 56px; display: flex; flex-direction: column; gap: 12px; }
.ft6__sns i {
  width: 26px; height: 26px; border-radius: 4px;
  background: var(--c-text); color: var(--c-white);
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.ft6__btm { top: 470px; border-top: 1px solid var(--c-line); padding-top: 30px; display: flex; align-items: center; }
.ft6__btm .copy { font-size: 12px; color: var(--c-mute); }
.ft6__btm .up {
  margin-left: auto; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--c-line); display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--c-sub);
}
</style>
</head>
<body>
<div class="stage">
  <div class="wf ft6">
    <div class="wf__inner ft6__top">
      <div class="ft6__logo en">LOGO</div>
      <div class="ft6__links">
        ダミー・ダミー項目<br>
        ダミー項目名<br>
        ダミーテキストの項目
      </div>
      <div class="ft6__sns">
        <i class="fa-brands fa-x-twitter"></i>
        <i class="fa-brands fa-youtube"></i>
        <i class="fa-regular fa-note-sticky"></i>
      </div>
    </div>
    <div class="wf__inner ft6__btm">
      <span class="copy en">©20XX Company. All Rights Reserved.</span>
      <span class="up"><i class="fa-solid fa-chevron-up"></i></span>
    </div>
  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
