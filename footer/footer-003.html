<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footer-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   共通ベース（CSSは共有せず、各HTMLに直書きする）
   アートボード 1440×800／コンテンツ幅 90%（1296px・左右余白72px）
   色は白・黒・グレーのみ／和文 Noto Sans JP・欧文 Poppins・アイコン Font Awesome
   ============================================================ */
:root {
  --wf-w: 1440px;
  --wf-h: 800px;
  --wf-content: 1296px;   /* コンテンツ幅 90% */
  --wf-pad: 72px;         /* 左右余白 */

  --c-black: #000;
  --c-text: #222;
  --c-sub: #555;
  --c-mute: #808080;
  --c-light: #b0b0b0;
  --c-line: #dcdcdc;
  --c-bg-gray: #f2f2f2;
  --c-img: #d9d9d9;
  --c-img-dark: #8c8c8c;
  --c-white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #e9e9e9;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 400;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* アートボード 1440×800。ビューポートに合わせて等倍スケールする */
.stage { position: fixed; inset: 0; overflow: hidden; }
.wf {
  position: relative;
  width: var(--wf-w); height: var(--wf-h);
  background: var(--c-white); overflow: hidden;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
}
/* コンテンツ幅90%のインナー枠 */
.wf__inner { position: absolute; left: var(--wf-pad); width: var(--wf-content); }

/* ユーティリティ */
.en { font-family: "Poppins", sans-serif; }
.img { position: relative; background: var(--c-img); }
.img--dark { background: var(--c-img-dark); }
.img[data-l]::after {
  content: attr(data-l);
  position: absolute; right: 10px; bottom: 8px;
  font-family: "Poppins", sans-serif; font-size: 9px; letter-spacing: .08em;
  color: #8a8a8a; line-height: 1;
}
/* 濃色（--c-img-dark #8c8c8c）の上では #8a8a8a が同化して読めないため明るくする */
.img--dark[data-l]::after { color: #d5d5d5; }
.dot { font-size: 8px; line-height: 1; }
/* 行頭に全角スペース（U+3000）を残さないための2つ。左端を上下の要素と揃えるために使う
   .sep   … 区切りに全角スペースを使う代わりに、前の要素へ 1em 空ける（折り返しても行頭に空白が残らない）
   .flush … やむを得ず行頭に全角スペースがあるとき、その字下げを打ち消す */
.sep { margin-right: 1em; }
.flush { text-indent: -1em; }
.btn-black {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-black); color: var(--c-white);
  border-radius: 999px; white-space: nowrap;
}
.tag-white {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-white); color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}
.tag-gray {
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e8e8; color: var(--c-text);
  border-radius: 999px; white-space: nowrap;
}

/* ============================================================
   03 FOOTER / 濃色。左にロゴ・住所、右にサイトマップ2列
   下部は1px罫線で区切り、SNSアイコン／ポリシーリンク／コピーライト
   実測（1440基準）：ロゴ h32／住所18px lh38／サイトマップ 見出し20px＋子14px
   背景をダークにするのは、白抜き文字を成立させるため（視認性の例外）
   ============================================================ */
.ft3 { background: #3a3d42; color: #fff; }

.ft3__top { top: 53px; display: flex; }
.ft3__logo { font-size: 26px; font-weight: 700; letter-spacing: .08em; }
.ft3__addr { margin-top: 32px; font-size: 18px; line-height: 38px; }

.ft3__nav { margin-left: auto; display: flex; gap: 130px; }
.ft3__nav h3 { font-size: 20px; font-weight: 700; line-height: 1.5; }
.ft3__nav h3 + h3 { margin-top: 34px; }
.ft3__nav .sub { margin-top: 18px; }
.ft3__nav .sub li { font-size: 14px; line-height: 1; margin-bottom: 22px; color: rgba(255,255,255,.85); }

.ft3__pagetop { position: absolute; right: var(--wf-pad); top: 575px; display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 700; }

.ft3__btm { top: 643px; border-top: 1px solid rgba(255,255,255,.35); padding-top: 40px; display: flex; align-items: center; }
.ft3__sns { display: flex; gap: 34px; font-size: 22px; }
.ft3__links { margin-left: auto; display: flex; gap: 40px; font-size: 15px; font-weight: 500; }
.ft3__copy { position: absolute; right: var(--wf-pad); top: 735px; font-size: 14px; color: rgba(255,255,255,.7); }
</style>
</head>
<body>
<div class="stage">
  <div class="wf ft3">

    <div class="wf__inner ft3__top">
      <!-- 左：ロゴ・住所 -->
      <div>
        <div class="ft3__logo en">LOGO</div>
        <p class="ft3__addr">
          ダミー株式会社<br>
          ダミー県ダミー市ダミー町0-0-0 ダミービル 00階
        </p>
      </div>

      <!-- 右：サイトマップ2列 -->
      <div class="ft3__nav">
        <div>
          <h3>ダミー項目</h3>
          <h3>ダミー項目名</h3>
          <ul class="sub">
            <li>ダミー項目</li>
            <li>ダミー項目名</li>
            <li>ダミー</li>
            <li>ダミー項目</li>
          </ul>
          <h3>ダミー項目名称</h3>
        </div>
        <div>
          <h3>ダミー項目</h3>
          <h3>ダミー項目名</h3>
          <h3>ダミー項目名称</h3>
        </div>
      </div>
    </div>

    <div class="ft3__pagetop en">Page Top <i class="fa-solid fa-arrow-up"></i></div>

    <div class="wf__inner ft3__btm">
      <div class="ft3__sns">
        <i class="fa-brands fa-x-twitter"></i>
        <i class="fa-brands fa-linkedin"></i>
        <i class="fa-brands fa-youtube"></i>
        <i class="fa-regular fa-note-sticky"></i>
      </div>
      <div class="ft3__links">
        <span>ダミー項目</span>
        <span>ダミー項目名</span>
        <span>ダミー項目名称</span>
      </div>
    </div>
    <p class="ft3__copy en">© 20XX Company.</p>

  </div>
</div>
<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1440, innerHeight / 800));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
